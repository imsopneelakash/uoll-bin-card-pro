<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e7a3c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>UOLL Bin Card Pro</title>
<style>
:root{--bg:#f1f7f3;--card:#fff;--ink:#16251b;--mut:#62736a;--pri:#1e7a3c;--pri-d:#14582a;--acc:#1fa3c8;--line:#d6e0d7;--err:#b3261e}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input{font:inherit}
.hidden{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 40px}
header.bar{background:var(--pri);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--acc)}
.bar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar h1{font-size:18px;font-weight:700;flex:1;letter-spacing:.2px}
.bar small{display:block;font-size:12px;opacity:.8;font-weight:400}
.role{background:var(--acc);color:#fff;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;text-transform:capitalize}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff}
.btn:hover{background:var(--pri-d)}
.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor;padding:6px 12px;font-size:14px}
.btn.light{background:#fff;color:var(--pri);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.crumb{display:flex;align-items:center;gap:8px;margin:18px 0 12px}
.crumb h2{font-size:20px;flex:1}
.back{background:none;border:0;color:var(--pri);font-weight:600;cursor:pointer;padding:6px 0}
.list{display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;color:inherit}
.item.off{border-left-color:var(--mut);opacity:.7}
.item b{display:block}
.item span.sub{color:var(--mut);font-size:14px}
.item .grow{flex:1}
.tag{font-size:12px;background:#e8eee9;color:var(--mut);border-radius:6px;padding:2px 8px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--mut)}
.row{display:flex;gap:8px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:15px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{background:#e8eee9;font-size:13px;color:var(--mut)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
#login{min-height:100%;display:grid;place-items:center;padding:20px}
.login-box{background:var(--card);border-radius:16px;border:1px solid var(--line);padding:28px 22px;width:100%;max-width:380px;border-top:6px solid var(--pri)}
.login-box h1{font-size:24px;color:var(--pri)}
.login-box p{color:var(--mut);margin:4px 0 20px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input[type=email],input[type=password],input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfdfb}
.err{color:var(--err);font-size:14px;margin-top:12px;min-height:20px}
.login-box .btn{width:100%;margin-top:16px}
dialog{border:0;border-radius:14px;padding:20px;width:min(90vw,380px)}
dialog::backdrop{background:rgba(10,30,15,.5)}
dialog h3{margin-bottom:10px}
dialog .row{margin:16px 0 0;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#16251b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw}
.logo{width:40px;height:40px;border-radius:50%;background:#fff;object-fit:contain}
.login-logo{display:block;width:150px;margin:0 auto 8px}
.login-box h1,.login-box p{text-align:center}
.tabs{display:flex;max-width:640px;margin:0 auto;padding:0 16px;gap:6px;border-bottom:1px solid var(--line)}
.tabs{overflow-x:auto}.tabs button{white-space:nowrap;background:none;border:0;padding:12px 14px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
input[type=search],input[type=number],input[type=date],input[type=text],select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfdfb}
.row input,.row select{flex:1;min-width:0}
.cat{font-size:15px;color:var(--pri);margin:20px 0 8px}
.chk{display:flex;align-items:center;gap:8px}
.item.ro{cursor:default}
dialog{max-height:90vh;overflow:auto}

.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.acts .btn.in{background:#1e7a3c}.acts .btn.out{background:#b3261e}.acts .btn.cnt{background:#1fa3c8}.acts .btn.opn{background:#4f5d54}
.sum{display:grid;gap:8px;margin-bottom:6px}
.sumc{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
.two{display:flex;gap:8px}.two>div{flex:1;min-width:0}
textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfdfb;font:inherit;resize:vertical}
.badge{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;color:#fff;white-space:nowrap}
.b-in{background:#1e7a3c}.b-out{background:#b3261e}.b-count{background:#1fa3c8}.b-opening{background:#4f5d54}
.ci{width:74px!important;padding:8px!important}
.b-ok{background:#1e7a3c}.b-bad{background:#b3261e}.b-none{background:#8a968e}
.cbar{position:sticky;bottom:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.paperhead{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.paperhead small{color:var(--mut);display:block;font-size:12px}
table.bc{font-size:13px}table.bc th,table.bc td{padding:8px 8px;vertical-align:top;white-space:nowrap}
table.bc td.w{white-space:normal;min-width:150px}
table.bc small{display:block;color:var(--mut);font-size:11px}
.papersign{display:none;justify-content:space-between;margin-top:46px;font-weight:700}
.papersign span{border-top:1px solid #000;padding-top:4px;min-width:150px;text-align:center}
.wm{display:none}
@media print{
  .wm{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:58%;max-width:520px;opacity:.1;z-index:0;pointer-events:none;mix-blend-mode:multiply;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:8mm}
  header.bar,.tabs,.back,.noprint,#toast{display:none!important}
  body{background:#fff}main.wrap{max-width:none!important;padding:0!important}
  .scroll{overflow:visible!important;border:0!important}
  table.bc{font-size:10px}table.bc th,table.bc td{padding:4px 5px;border:1px solid #444}
  table.bcard{width:100%;margin:0 auto;position:relative;z-index:1}
  table.bcard th,table.bcard td,table.bcard td.n,table.bcard th.n{text-align:center!important;vertical-align:middle}
  table.bcard td,table.bcard td.w{background:transparent!important}
  body.wm-on .wm{display:block}
  .papersign{display:flex}.paperhead{border:1px solid #444;border-radius:0}
}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 14px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--acc);border-radius:12px;padding:10px 14px}
.kpi span{display:block;font-size:12px;color:var(--mut)}.kpi b{display:block;font-size:22px;line-height:1.25}.kpi small{display:block;font-size:12px;color:var(--mut)}
.kpi.bad{border-top-color:var(--err)}.kpi.good{border-top-color:var(--pri)}
td.stick,th.stick{position:sticky;left:0;background:#fff;z-index:1}
details.sup{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:10px 14px}
details.sup summary{cursor:pointer;font-weight:600}
.acts .btn.wo{background:#8a4b00}.acts .btn.ret{background:#00796b}
.b-wo{background:#8a4b00}.b-rev{background:#6a1b9a}.b-ret{background:#00796b}
tr.rv td{color:var(--mut)}
.kpi.warn{border-top-color:#8a4b00}

/* ---------- App shell (bottom navigation, bottom sheets, app bar) ---------- */
body{padding:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button,.item,.btn,select{touch-action:manipulation}
button:active,.item:active{transform:scale(.98);transition:transform .08s}
#login{padding-top:env(safe-area-inset-top)}
header.bar{padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:0;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.bar h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.logo{width:34px;height:34px;flex:none}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;cursor:pointer;flex:none;position:relative}
.ib svg{width:22px;height:22px}
#navBack:not(.hidden)+.logo{display:none}
.ib .dot{position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:#ffb300;border:2px solid var(--pri)}
.tabs{position:fixed;left:0;right:0;bottom:0;max-width:none;margin:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:0;border-top:1px solid var(--line);border-bottom:0;background:#fff;z-index:8;overflow:visible;justify-content:space-around;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;margin:0;border:0;border-radius:12px;font-size:11.5px;font-weight:600;position:relative}
.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--pri);background:#e6f2ea;border-bottom:0}
.tabs button[data-n]:not([data-n=""])::after{content:attr(data-n);position:absolute;top:1px;left:calc(50% + 6px);background:var(--err);color:#fff;border-radius:99px;font-size:10px;line-height:16px;min-width:16px;padding:0 4px;text-align:center}
#tabUsers{display:none!important}
main.wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.back:not(.grow){display:none}
.crumb{flex-wrap:wrap}
.crumb h2{flex:1 1 55%;min-width:0}
.item .grow{min-width:130px}
.spin{width:34px;height:34px;border:4px solid #d6e0d7;border-top-color:var(--pri);border-radius:50%;margin:56px auto;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
dialog{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:560px;max-height:88vh;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));animation:sheet .22s ease-out}
dialog::backdrop{background:rgba(10,30,15,.5)}
@keyframes sheet{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
select[size]{border-radius:12px;padding:4px}
select[size] option{padding:10px 8px;border-radius:8px}
#toast{bottom:calc(84px + env(safe-area-inset-bottom))}
#offline{background:#8a4b00;color:#fff;text-align:center;font-size:13px;padding:6px 12px}
.av{background:var(--pri);color:#fff;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.av.big{width:52px;height:52px;font-size:20px;flex:none}
.acct-h{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.mut{color:var(--mut);font-size:14px}
#updBox a{display:block;background:#fff4e0;border:1px solid #e6b45c;border-radius:12px;padding:12px 14px;margin:0 0 12px;color:#7a4a00;font-weight:600;text-decoration:none}
@media (prefers-reduced-motion:reduce){dialog{animation:none}.spin{animation-duration:2s}button:active,.item:active{transform:none}}

/* ---------- Design v2 ---------- */
:root{--bg:#eef3ef;--ink:#14251a;--mut:#5b6e62;--line:#e1e9e3;--sh:0 1px 2px rgba(15,60,30,.06),0 4px 14px rgba(15,60,30,.05)}
body{background:var(--bg)}
header.bar{background:linear-gradient(135deg,#124f26 0%,#1e7a3c 100%);box-shadow:0 2px 10px rgba(10,50,24,.25)}
.bar h1{font-weight:700}
.ib{background:rgba(255,255,255,.16)}
.crumb{margin:20px 0 12px}.crumb h2{font-size:22px;font-weight:700;letter-spacing:-.2px}
.btn{border-radius:12px;padding:12px 18px}
.btn.light{border-color:var(--line)}
.ic{width:20px;height:20px;flex:none;vertical-align:middle}
.item{border:1px solid var(--line);border-left:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);background:#fff}
.item.off{opacity:.65;border-left-color:var(--line)}
.item.ro{cursor:default}
.ico{width:42px;height:42px;border-radius:13px;background:#e4f2e8;color:#14582a;display:flex;align-items:center;justify-content:center;flex:none}
.ico .ic{width:22px;height:22px}
.ico.b{background:#e0f1f7;color:#0c5f7a}.ico.o{background:#fcefd6;color:#854f0b}.ico.r{background:#fbe5e3;color:#a32d2d}.ico.p{background:#ece6f6;color:#4a2e86}
.chev{color:#9bab9f;display:flex}.chev .ic{width:18px;height:18px}
.item .btn.ghost{border-color:var(--line);border-radius:10px;padding:5px 10px;font-size:13px}
.hero{background:linear-gradient(135deg,#124f26,#1e7a3c 70%,#1b8a6b);color:#fff;border-radius:22px;padding:18px 18px 16px;margin:14px 0 4px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-34px;top:-34px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero small{display:block;color:#bfe6cb;font-size:13px}
.hero-t b{font-size:20px;font-weight:700}
.hero-v{font-size:32px;font-weight:700;margin-top:10px;letter-spacing:-.5px}
.hero-s{margin-top:6px;color:#d9f0e0}
.hero.sm{padding:14px 16px;margin-top:6px}.hero.sm b{display:block;font-size:24px;font-weight:700;margin-top:1px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;position:relative;z-index:1}
.pills span{background:rgba(255,255,255,.16);border-radius:99px;padding:4px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.pills .ic{width:14px;height:14px}
.alert{background:#fff4e0;border:1px solid #f0d090;color:#6b4300;border-radius:14px;padding:10px 14px;margin:12px 0;font-size:14px}
.alert b{display:block}
.actp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 10px}
.act{border:0;border-radius:16px;padding:16px 10px;color:#fff;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.act .ic{width:26px;height:26px}
.act.in{background:linear-gradient(135deg,#1e7a3c,#2b9a50)}.act.out{background:linear-gradient(135deg,#b3261e,#d2453b)}
.actg{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 4px;font-size:12.5px;font-weight:600;color:#2c4033;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;box-shadow:var(--sh)}
.tile .ic{width:22px;height:22px;color:var(--pri)}
.st .bar{display:block;height:5px;background:#e6eee8;border-radius:4px;margin-top:6px;overflow:hidden}
.st .bar i{display:block;height:100%;background:linear-gradient(90deg,#1e7a3c,#3fb36a);border-radius:4px}
.st .qty{font-size:18px;font-weight:700}.st .qty small{font-size:11px;color:var(--mut);font-weight:400}
.kpi,.kpi.bad,.kpi.good,.kpi.warn{border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--sh)}
.kpi .ki{width:30px;height:30px;border-radius:10px;background:#e4f2e8;color:#14582a;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.kpi .ki .ic{width:17px;height:17px}
.kpi.bad .ki{background:#fbe5e3;color:#a32d2d}.kpi.warn .ki{background:#fcefd6;color:#854f0b}
.kpi b{font-size:21px;font-weight:700}
.sumc{border-left:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
table{border-radius:14px;box-shadow:var(--sh)}
th{background:#eef4ef}
tr:nth-child(even) td{background:#fafcfa}
.empty{border-radius:16px;padding:32px 16px}
.cat{color:#14582a;font-size:14px;font-weight:700;margin:22px 0 8px}
.badge{border-radius:99px;padding:2px 9px}
input[type=search],input[type=number],input[type=date],input[type=text],input[type=email],input[type=password],select,textarea{border-radius:12px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #1fa3c866;border-color:var(--acc)}
dialog{border-radius:24px 24px 0 0}
dialog::before{content:"";display:block;width:42px;height:4px;border-radius:4px;background:#d3ddd5;margin:-8px auto 14px}
#toast{background:#14251a;border-radius:14px;padding:12px 18px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tabs{border-top:0;box-shadow:0 -4px 18px rgba(15,60,30,.10)}
.tabs button.on{background:#e4f2e8;color:#14582a}
.skl{display:grid;gap:10px;margin-top:18px}
.skl i{display:block;height:64px;border-radius:16px;background:linear-gradient(90deg,#e6ede8 25%,#f3f7f4 50%,#e6ede8 75%);background-size:200% 100%;animation:shm 1.2s linear infinite}

.login-box h1{font-size:22px;font-weight:700}
.pwrow{position:relative}.pwrow input{padding-right:46px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none!important;border:0;width:40px;height:40px;color:var(--mut);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.bcl{display:none;gap:10px}

.bcc-h{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:12.5px}

.bcc-p{font-weight:600;margin:6px 0 2px}
.bcc-q{display:flex;align-items:baseline;gap:8px}.bcc-q .q{font-size:20px;font-weight:700}
.dl.up{color:#14582a;font-weight:700}.dl.dn{color:#a32d2d;font-weight:700}
.bcc-m{color:var(--mut);font-size:13.5px;margin-top:4px}.bcc-n{font-size:13px;color:#4a5b50;margin-top:2px}
.bcc-f{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid #edf2ee;font-size:12.5px;color:var(--mut)}
.bcc-f .ic{width:14px;height:14px;color:#14582a}
@media (max-width:760px){.bcT{display:none}.bcl{display:grid}.noprint .row{flex-wrap:wrap}.noprint .row .btn{flex:1 1 auto}.paperhead{grid-template-columns:1fr}}

const I = n => '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (IC[n] || '') + '</svg>';

const isAdmin = () => me && (me.role === 'master' || me.role === 'admin');

/* ---------- Auth ---------- */
async function boot(){
  const { data } = await db.auth.getSession();
  if (data.session) await enter(); else showLogin();
}
function showLogin(msg = ''){
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#loginErr').textContent = msg; $('#pw').value = '';
}
async function enter(){
  const { data: u } = await db.auth.getUser();
  if (!u.user) return showLogin();
  const { data, error } = await db.from('profiles').select('*').eq('id', u.user.id).single();
  if (error || !data) { await db.auth.signOut(); return showLogin('Your profile could not be loaded. Contact the administrator.'); }
  if (!data.is_active) { await db.auth.signOut(); return showLogin('This account is deactivated. Contact the administrator.'); }
  me = data;
  $('#whoSub').textContent = me.full_name || me.email || '';
  $('#roleTag').textContent = me.role;
  $('#tabUsers').classList.toggle('hidden', !isAdmin());
  $('#tabReports').classList.toggle('hidden', !isAdmin());
  $('#tabVerify').classList.toggle('hidden', !isAdmin());
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  fillAccount(); navStack = []; go({ t: 'wh' }); checkUpdate();
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const b = $('#loginBtn'); b.disabled = true; b.textContent = 'Signing in...';
  const { error } = await db.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
  b.disabled = false; b.textContent = 'Sign in';
  if (error) return showLogin('Sign-in failed. Check your email and password.');
  await enter();
});
$('#logout').addEventListener('click', async () => { await db.auth.signOut(); me = null; showLogin(); });

/* ---------- Views ---------- */
function go(v, isBack){ navUpdate(v, isBack); view = v; document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === (v.t === 'prod' ? 'prod' : (v.t === 'loc' || v.t === 'locdetail') ? 'loc' : v.t === 'users' ? 'users' : v.t === 'verify' ? 'verify' : (v.t === 'reports' || v.t === 'rep') ? 'reports' : 'wh'))); render(); window.scrollTo(0, 0); updateBar(); }
async function render(){
  const el = $('#view');
  refreshBadge();
  el.style.maxWidth = view.t === 'bincard' ? '1400px' : '';
  el.innerHTML = '<div class="skl" role="status" aria-label="Loading"><i></i><i></i><i></i><i></i></div>';
  try {
    if (view.t === 'wh') await renderWarehouses(el);
    else if (view.t === 'prod') await renderProducts(el);
    else if (view.t === 'loc') await renderLocations(el);
    else if (view.t === 'users') await renderUsers(el);
    else if (view.t === 'verify') await renderVerify(el);
    else if (view.t === 'wcount') await renderWhCount(el);
    else if (view.t === 'whstock') await renderWhStock(el);
    else if (view.t === 'reports') await renderReports(el);
    else if (view.t === 'rep') await renderRep(el);
    else if (view.t === 'locdetail') await renderLocationDetail(el);
    else if (view.t === 'shelves') await renderShelves(el);
    else if (view.t === 'count') await renderCount(el);
    else if (view.t === 'bincard') await renderBinCard(el);
    else await renderShelf(el);
  } catch (err) {
    el.innerHTML = '<div class="empty">Could not load data. Check your connection and try again.</div>';
  }
}

async function renderWarehouses(el){
  const { data, error } = await db.from('warehouses').select('*').order('name');
  if (error) throw error;
  const rows = (data || []).filter(w => isAdmin() || w.is_active);
  let inv = [], dash = null;
  if (isAdmin()) {
    const [a1, b1] = await Promise.all([db.rpc('inventory_summary'), db.rpc('report_dashboard')]);
    if (!a1.error) inv = a1.data || [];
    if (!b1.error) dash = b1.data || null;
  }
  const byId = {}; inv.forEach(x => byId[x.warehouse_id] = x);
  const totPcs = inv.reduce((t, x) => t + Number(x.total_pcs || 0), 0), totVal = inv.reduce((t, x) => t + Number(x.total_value || 0), 0);
  const hr = new Date().getHours(), greet = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
  const first = String((me && (me.full_name || me.email)) || '').split(' ')[0];
  el.innerHTML = `<div class="hero"><div class="hero-t"><small>${greet}</small><b>${esc(first)}</b></div>
    ${isAdmin() ? `<div class="hero-v">&#2547; ${n0(totVal)}</div><small>Total inventory value &middot; ${n0(totPcs)} pcs</small>
      ${dash ? `<div class="pills"><span>${I('in')} ${n0(dash.receipts_pcs)} in today</span><span>${I('out')} ${n0(dash.issues_pcs)} out</span><span>${I('check')} ${n0(dash.unaudited)} to audit</span></div>` : ''}`
      : '<div class="hero-s">Choose a warehouse to start.</div>'}</div>
    <div class="crumb"><h2>Warehouses</h2>${isAdmin() ? '<button class="btn" id="addWh">Add warehouse</button>' : ''}</div>
    <div class="list">${rows.length ? rows.map((w, i) => { const x = byId[w.id];
      return `<button class="item ${w.is_active ? '' : 'off'}" data-id="${w.id}" data-name="${esc(w.name)}"><span class="ico ${ICO_CLS[i % 3]}">${I('warehouse')}</span>
      <span class="grow"><b>${esc(w.name)}</b><span class="sub">${isAdmin() && x ? n0(x.total_pcs) + ' pcs &middot; &#2547; ' + n0(x.total_value) : 'Tap to view shelves'}</span></span>${w.is_active ? '' : '<span class="tag">Inactive</span>'}<span class="chev">${I('chev')}</span></button>`; }).join('')
      : '<div class="empty">No warehouses yet. Add the first warehouse to get started.</div>'}</div>`;
  el.querySelectorAll('.item').forEach(b => b.onclick = () => go({ t: 'shelves', wh: { id: b.dataset.id, name: b.dataset.name } }));
  const add = $('#addWh');
  if (add) add.onclick = async () => {
    const name = await askName('New warehouse name'); if (!name) return;
    const msg = await place('warehouse', 'add', { name });
    if (msg) toast(msg); else { toast('Warehouse added.'); render(); }
  };
}

async function renderShelves(el){
  const wh = view.wh;
  const { data, error } = await db.from('shelves').select('*').eq('warehouse_id', wh.id).order('name');
  if (error) throw error;
  const rows = (data || []).filter(s => isAdmin() || s.is_active);
  const shelfTotal = {};
  if (isAdmin() && rows.length) {
    const sd = await db.from('stock').select('shelf_id,qty_pcs').in('shelf_id', rows.map(s => s.id));
    (sd.data || []).forEach(x => { shelfTotal[x.shelf_id] = (shelfTotal[x.shelf_id] || 0) + Number(x.qty_pcs); });
  }
  el.innerHTML = `<button class="back" id="bk">&larr; Warehouses</button>
    <div class="crumb"><h2>${esc(wh.name)}</h2>${isAdmin() ? '<button class="btn light" id="rnWh">Rename</button><button class="btn light" id="dlWh" style="color:var(--err)">Delete</button><button class="btn" id="addSh">Add shelf</button>' : ''}</div>
    ${isAdmin() ? `<button class="item" id="whStock" style="margin-bottom:10px"><span class="ico">${I('box')}</span><span class="grow"><b>Current stock</b><span class="sub">Shelf wise and product wise</span></span><span class="chev">${I('chev')}</span></button>` : ''}
    <button class="item" id="whCount" style="margin-bottom:14px"><span class="ico b">${I('count')}</span><span class="grow"><b>Physical count</b><span class="sub">Count the whole warehouse</span></span><span class="chev">${I('chev')}</span></button>
    <div class="list">${rows.length ? rows.map(s => `<div class="item ${s.is_active ? '' : 'off'}" style="cursor:default;flex-wrap:wrap">
      <span class="ico">${I('shelf')}</span><button class="grow back" style="text-align:left;color:inherit" data-id="${s.id}" data-name="${esc(s.name)}"><b>${esc(shLbl(s.name))}</b><span class="sub">${isAdmin() ? n0(shelfTotal[s.id] || 0) + ' pcs &middot; ' : ''}View stock on this shelf</span></button>
      ${s.is_active ? '' : '<span class="tag">Inactive</span>'}
      ${isAdmin() ? `<button class="btn ghost" data-rn="${s.id}" data-nm="${esc(s.name)}" style="color:var(--pri)">Rename</button><button class="btn ghost" data-dl="${s.id}" data-nm="${esc(s.name)}" style="color:var(--err)">Delete</button><button class="btn ghost" data-tg="${s.id}" data-on="${s.is_active}" style="color:var(--pri)">${s.is_active ? 'Deactivate' : 'Activate'}</button>` : ''}</div>`).join('')
      : '<div class="empty">No shelves in this warehouse yet.' + (isAdmin() ? ' Add the first shelf.' : '') + '</div>'}</div>`;
  $('#bk').onclick = () => go({ t: 'wh' });
  el.querySelectorAll('button[data-name]').forEach(b => b.onclick = () => go({ t: 'shelf', wh, shelf: { id: b.dataset.id, name: b.dataset.name } }));
  el.querySelectorAll('button[data-tg]').forEach(b => b.onclick = async () => {
    const { error } = await db.from('shelves').update({ is_active: b.dataset.on !== 'true' }).eq('id', b.dataset.tg);
    if (error) toast('Could not update the shelf.'); else render();
  });
  el.querySelectorAll('button[data-rn]').forEach(b => b.onclick = async () => {
    const name = await askName('Rename shelf', b.dataset.nm); if (!name || name === b.dataset.nm) return;
    const msg = await place('shelf', 'rename', { id: b.dataset.rn, name });
    if (msg) toast(msg); else { toast('Shelf renamed.'); render(); }
  });
  el.querySelectorAll('button[data-dl]').forEach(b => b.onclick = async () => {
    if (!delConfirm('shelf', b.dataset.nm)) return;
    const msg = await place('shelf', 'delete', { id: b.dataset.dl });
    if (msg) toast(msg); else { toast('Shelf deleted.'); render(); }
  });
  const rw = $('#rnWh'), dw = $('#dlWh');
  if (rw) rw.onclick = async () => {
    const name = await askName('Rename warehouse', wh.name); if (!name || name === wh.name) return;
    const msg = await place('warehouse', 'rename', { id: wh.id, name });
    if (msg) toast(msg); else { toast('Warehouse renamed.'); go({ t: 'shelves', wh: { id: wh.id, name } }); }
  };
  if (dw) dw.onclick = async () => {
    if (!delConfirm('warehouse', wh.name)) return;
    const msg = await place('warehouse', 'delete', { id: wh.id });
    if (msg) toast(msg); else { toast('Warehouse deleted.'); go({ t: 'wh' }); }
  };
  $('#whCount').onclick = () => go({ t: 'wcount', wh });
  const ws = $('#whStock'); if (ws) ws.onclick = () => go({ t: 'whstock', wh });
  const add = $('#addSh');
  if (add) add.onclick = async () => {
    const name = await askName('New shelf name'); if (!name) return;
    const msg = await place('shelf', 'add', { name, parent: wh.id });
    if (msg) toast(msg); else { toast('Shelf added.'); render(); }
  };
}

const TYPE_LABEL = { opening: 'Opening balance', in: 'Stock in', out: 'Stock out', count: 'Physical count', transfer: 'Transfer out' };
const TYPE_HINT = { opening: 'Sets the starting balance. The shelf balance becomes the quantity you enter.',
  in: 'Adds the quantity to the shelf balance.', out: 'Removes the quantity from the shelf balance.',
  transfer: 'Removes the quantity from this shelf and sends it to the selected location or shelf.',
  count: 'Physical count. The shelf balance becomes the counted quantity.' };

function entryDialog(type, shelf, products, stockMap, dests){
  return new Promise(res => {
    const d = $('#edlg'), q = $('#eQ'), sel = $('#eProd'), ctn = $('#eCtn'), pcs = $('#ePcs'), err = $('#eErr'), save = $('#eSave');
    $('#eTitle').textContent = TYPE_LABEL[type] + ' - ' + shLbl(shelf.name);
    ctn.value = 0; pcs.value = 0; $('#eNote').value = ''; err.textContent = ''; q.value = '';
    $('#ePty').value = ''; $('#eRef').value = '';
    $('#eParty').classList.toggle('hidden', type !== 'in');
    $('#eRefW').classList.toggle('hidden', !(type === 'in' || type === 'transfer'));
    $('#eRefL').textContent = type === 'transfer' ? 'Issue no' : 'Challan / reference no (optional)';
    const cur = () => products.find(p => p.id === sel.value);
    const calc = () => {
      const p = cur(); const bal = p ? (stockMap[p.id] || 0) : 0;
      if (!p) { $('#eBal').textContent = 'Select a product.'; $('#eTot').textContent = ''; return; }
      const tot = parseInt(pcs.value, 10) || 0;
      $('#eBal').textContent = isAdmin() ? 'Current balance on this shelf: ' + bal + ' pcs.' : '';
      const after = type === 'in' ? bal + tot : (type === 'out' || type === 'transfer') ? bal - tot : tot;
      $('#eTot').textContent = TYPE_HINT[type] + ' Entry: ' + tot + ' pcs.' + (isAdmin() ? ' New balance: ' + after + ' pcs.' : '');
    };
    const fill = () => {
      const t = q.value.trim().toLowerCase(), keep = sel.value;
      const rows = products.filter(p => !t || p.name.toLowerCase().includes(t) || p.code.toLowerCase().includes(t));
      sel.innerHTML = rows.map(p => `<option value="${p.id}">${esc(p.code)} - ${esc(p.name)}</option>`).join('');
      if (rows.some(p => p.id === keep)) sel.value = keep; else if (rows.length) sel.value = rows[0].id;
      calc();
    };
    const dw = $('#eDW'), ds = $('#eDS');
    $('#eDest').classList.toggle('hidden', type !== 'transfer');
    const dt = $('#eDT'), ls = $('#eLS');
    if (type === 'transfer') {
      const srcKey = String((view.wh && view.wh.name) || '').trim().toLowerCase();
      const locsOk = dests.locs.filter(l => String(l.name).trim().toLowerCase() !== srcKey);
      $('#eFrom').innerHTML = 'From (source): <b>' + esc(view.wh.name) + ' / ' + esc(shLbl(shelf.name)) + '</b>. The source place is not listed as a destination.';
      ls.innerHTML = locsOk.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('');
      dt.innerHTML = (locsOk.length ? '<option value="loc">Location (outlet, store, etc.)</option>' : '') + (dests.whs.length ? '<option value="shelf">Another shelf (warehouse transfer)</option>' : '');
      const sw = () => { $('#eShelfDest').classList.toggle('hidden', dt.value !== 'shelf'); $('#eLoc').classList.toggle('hidden', dt.value !== 'loc'); };
      dt.onchange = sw; sw();
      dw.innerHTML = dests.whs.map(w => `<option value="${w.id}">${esc(w.name)}</option>`).join('');
      const fillS = () => { ds.innerHTML = dests.shelves.filter(x => x.warehouse_id === dw.value && x.id !== shelf.id).map(x => `<option value="${x.id}">${esc(shLbl(x.name))}</option>`).join(''); };
      dw.onchange = fillS;
      if (dests.whs.some(w => w.id === view.wh.id)) dw.value = view.wh.id;
      fillS();
    }
    q.oninput = fill; sel.onchange = calc; ctn.oninput = calc; pcs.oninput = calc;
    $('#eCancel').onclick = () => d.close();
    $('#eForm').onsubmit = async e => {
      e.preventDefault(); err.textContent = '';
      const p = cur(); if (!p) { err.textContent = 'Select a product.'; return; }
      const c = parseInt(ctn.value, 10) || 0, n = parseInt(pcs.value, 10) || 0;
      if (c < 0 || n < 0) { err.textContent = 'Quantity cannot be negative.'; return; }
      if (type !== 'count' && type !== 'opening' && c === 0 && n === 0) { err.textContent = 'Enter a quantity greater than zero.'; return; }
      const note = $('#eNote').value.trim() || null;
      const ref = $('#eRef').value.trim() || null, party = $('#ePty').value.trim() || null;
      if (type === 'transfer' && !ref) { err.textContent = 'Enter the issue no.'; return; }
      const toLoc = type === 'transfer' && dt.value === 'loc';
      if (type === 'transfer' && toLoc && !ls.value) { err.textContent = 'Select a location.'; return; }
      if (type === 'transfer' && !toLoc && !ds.value) { err.textContent = 'Select a destination shelf.'; return; }
      save.disabled = true; save.textContent = 'Saving...';
      const { error } = toLoc
        ? await db.rpc('transfer_out_to_location', { p_shelf: shelf.id, p_location: ls.value, p_product: p.id, p_cartons: c, p_pcs: n, p_note: note, p_issue_no: ref })
        : type === 'transfer'
        ? await db.rpc('transfer_between_shelves', { p_from_shelf: shelf.id, p_to_shelf: ds.value, p_product: p.id, p_cartons: c, p_pcs: n, p_note: note, p_issue_no: ref })
        : await db.rpc('add_bin_entry', { p_shelf: shelf.id, p_product: p.id, p_type: type, p_cartons: c, p_pcs: n, p_note: note, p_party: type === 'in' ? party : null, p_issue_no: type === 'in' ? ref : null });
      save.disabled = false; save.textContent = type === 'transfer' ? 'Transfer' : 'Save entry';
      if (error) { err.textContent = error.message || 'Could not save the entry.'; return; }
      d.close('ok');
    };
    d.onclose = () => res(d.returnValue === 'ok');
    d.returnValue = ''; fill(); d.showModal();
  });
}

function typeLbl(x){
  const n = x.note || '';
  if (x.entry_type === 'out' && n.startsWith('Transfer to')) return 'Transfer out';
  if (x.entry_type === 'in' && n.startsWith('Transfer from')) return 'Transfer in';
  if (n.startsWith('Write-off (')) return 'Write-off';
  if (x.entry_type === 'in' && n.startsWith('Return from location:')) return 'Return from location';
  return TYPE_LABEL[x.entry_type] || x.entry_type;
}

async function renderCount(el){
  const { wh, shelf } = view;
  const [cv, pr] = await Promise.all([
    db.rpc('count_employee_view', { p_shelf: shelf.id, p_date: ymd(new Date()) }),
    db.from('products').select('id,code,name,is_active').order('name')
  ]);
  if (cv.error) throw cv.error; if (pr.error) throw pr.error;
  const all = cv.data || [], prods = pr.data || [];
  const rows = all.filter(r => r.state === 'recount' || r.state === 'todo');
  const waiting = all.filter(r => r.state === 'pending').length, done = all.filter(r => r.state === 'verified').length;
  const known = new Set(all.map(r => r.product_id));
  const list = rows.map(r => ({ id: r.product_id, code: r.product_code, name: r.product_name, recount: r.state === 'recount', note: r.recount_note }));
  const vals = {};
  const upd = () => {
    let n = 0;
    list.forEach(p => { const v = vals[p.id]; const has = v != null && v !== ''; if (has) n++; const c = el.querySelector(`tr[data-id="${p.id}"] .rs`); if (c) c.innerHTML = has ? '<span class="badge b-count">Entered</span>' : '<span class="badge b-none">Not counted</span>'; });
    $('#csum').innerHTML = `<b style="color:var(--pri)">Entered: ${n}</b> &middot; Not counted: ${list.length - n}`;
  };
  const draw = () => {
    const extra = prods.filter(p => p.is_active && !known.has(p.id) && !list.some(x => x.id === p.id));
    el.innerHTML = `<button class="back" id="bk">&larr; ${esc(shLbl(shelf.name))}</button>
      <div class="crumb"><h2>Physical count - ${esc(shLbl(shelf.name))}</h2></div>
      <div class="hint" style="margin:0 0 12px">Count what you see on the shelf and enter the quantity in pcs for each product. Leave a row empty to skip it. Your count is sent to a master or admin for verification. Products already counted today are not shown again.</div>
      ${waiting || done ? `<div class="hint" style="margin:0 0 12px">Awaiting verification: <b>${waiting}</b> &middot; Verified today: <b>${done}</b></div>` : ''}
      ${list.length ? `<div class="scroll"><table><thead><tr><th>Code</th><th>Product</th><th>Counted (pcs)</th><th>Status</th></tr></thead><tbody>
      ${list.map(p => `<tr data-id="${p.id}"><td>${esc(p.code)}</td><td>${esc(p.name)}${p.recount ? ` <span class="badge b-bad">Recount</span>${p.note ? `<small style="display:block;color:var(--mut)">${esc(p.note)}</small>` : ''}` : ''}</td>
        <td><input class="ci" type="number" min="0" step="1" inputmode="numeric" value="${esc(vals[p.id] ?? '')}" aria-label="Counted pcs"></td><td class="rs"></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">There are no products to count on this shelf right now.</div>'}
      <div class="row" style="margin-top:12px"><select id="xp" aria-label="Add a product that is not on the list"><option value="">Add a product that is not on the list...</option>${extra.map(p => `<option value="${p.id}">${esc(p.code)} - ${esc(p.name)}</option>`).join('')}</select><button class="btn light" id="xa">Add</button></div>
      <div class="cbar"><span id="csum"></span><button class="btn" id="csave">Submit for verification</button></div>`;
    $('#bk').onclick = () => go({ t: 'shelf', wh, shelf });
    el.querySelectorAll('input.ci').forEach(i => i.oninput = () => { vals[i.closest('tr').dataset.id] = i.value; upd(); });

async function renderShelf(el){

  const [st, pr] = await Promise.all([

  ]);

  const stockMap = {}; (st.data || []).forEach(r => stockMap[r.product_id] = r.qty_pcs);
  const products = (pr.data || []).filter(p => p.is_active);

  try { const { data: cv } = await db.rpc('count_employee_view', { p_shelf: shelf.id, p_date: ymd(new Date()) }); rcN = (cv || []).filter(x => x.state === 'recount').length; } catch (e) {}
  const rows = (st.data || []).filter(r => r.qty_pcs > 0 && r.products).sort((a, b) => a.products.name.localeCompare(b.products.name));

  el.innerHTML = `<button class="back" id="bk">&larr; ${esc(wh.name)}</button>
    <div class="hero sm"><small>${esc(wh.name)}</small><b>${esc(shLbl(shelf.name))}</b>
      ${isAdmin() ? `<div class="pills"><span>${rows.length} products</span><span>${n0(stTot)} pcs</span></div>` : ''}</div>
    ${rcN ? `<div class="alert"><b>${rcN} product(s) need a recount</b>Open Physical count to recount them.</div>` : ''}
    <div class="actp">
      <button class="act in" data-ty="in">${I('in')}<span>Stock in</span></button>
      <button class="act out" data-ty="transfer">${I('out')}<span>Transfer out</span></button>
    </div>
    <div class="actg">
      <button class="tile" data-ty="count">${I('count')}<span>Physical count</span></button>
      <button class="tile" data-ty="writeoff">${I('trash')}<span>Write-off</span></button>
      <button class="tile" data-ty="return">${I('ret')}<span>Return</span></button>
      ${isAdmin() ? `<button class="tile" data-ty="opening">${I('flag')}<span>Opening balance</span></button>` : ''}
    </div>
    <button class="item" data-ty="bincard" style="margin:12px 0 4px"><span class="ico b">${I('book')}</span><span class="grow"><b>Bin card</b><span class="sub">Full journey of this shelf</span></span><span class="chev">${I('chev')}</span></button>
    ${isAdmin() ? '<h3 class="cat">Current stock</h3>' : ''}
    ${!isAdmin() ? '<div class="hint" style="margin-top:14px">Stock quantities are visible to master and admin only. Use Physical count to record what you see on the shelf.</div>' : rows.length ? `${rows.length > 6 ? '<input id="sq" type="search" placeholder="Search product" aria-label="Search product" style="margin-bottom:10px">' : ''}
    <div class="list" id="stl">${rows.map(r => `<div class="item ro st" data-q="${esc((r.products.code + ' ' + r.products.name).toLowerCase())}"><span class="grow"><b>${esc(r.products.name)}</b><span class="sub">Code ${esc(r.products.code)}</span><span class="bar"><i style="width:${Math.max(4, Math.round(Number(r.qty_pcs) / stMax * 100))}%"></i></span></span><b class="qty">${n0(r.qty_pcs)}<small> pcs</small></b></div>`).join('')}</div>` : '<div class="empty">No stock on this shelf yet.</div>'}`;
  const sq = $('#sq'); if (sq) sq.oninput = () => { const q = sq.value.trim().toLowerCase(); el.querySelectorAll('#stl .st').forEach(c => c.classList.toggle('hidden', !!q && !c.dataset.q.includes(q))); };
  $('#bk').onclick = () => go({ t: 'shelves', wh });
  el.querySelectorAll('[data-ty]').forEach(b => b.onclick = async () => {
    const ty = b.dataset.ty;
    if (ty === 'count') return go({ t: 'count', wh, shelf });
    if (ty === 'bincard') return go({ t: 'bincard', wh, shelf });
    if (ty === 'writeoff') {
      const wl = products.filter(p => (stockMap[p.id] || 0) > 0);
      if (!wl.length) return toast('There is no stock on this shelf to write off.');
      if (await writeOffDialog(shelf, wl, stockMap)) { toast('Write-off recorded.'); render(); }
      return;
    }
    if (ty === 'return') {
      const { data: lc, error: le } = await db.from('locations').select('id,name,is_active').order('name');
      const locs = le ? [] : (lc || []).filter(x => x.is_active);
      if (!locs.length) return toast('No active location available.');
      if (await returnDialog(shelf, locs, pr.data || [])) { toast('Return recorded.'); render(); }
      return;
    }
    let list = products, dests = null;
    if (ty === 'transfer') {
      list = products.filter(p => (stockMap[p.id] || 0) > 0);
      if (!list.length) return toast('There is no stock on this shelf to transfer.');
      const [w, sh, lc] = await Promise.all([db.from('warehouses').select('id,name,is_active').order('name'), db.from('shelves').select('id,name,warehouse_id,is_active').order('name'), db.from('locations').select('id,name,is_active').order('name')]);
      if (w.error || sh.error) return toast('Could not load destinations.');
      const locs = lc.error ? [] : (lc.data || []).filter(x => x.is_active);
      const shelves = (sh.data || []).filter(x => x.is_active && x.id !== shelf.id);
      const whs = (w.data || []).filter(x => x.is_active && shelves.some(y => y.warehouse_id === x.id));
      if (!whs.length && !locs.length) return toast('No destination available. Add a location first.');
      dests = { whs, shelves, locs };
    }
    if (!list.length) return toast('No active products available.');
    if (await entryDialog(ty, shelf, list, stockMap, dests)) { toast(ty === 'transfer' ? 'Transfer completed.' : 'Entry saved.'); render(); }
  });
}

const noteShown = x => {
  const n = x.note || '';
  if (/^Transfer (to|from)/.test(n)) return '';
  const m = /^Return from location: .*?(?: - (.*))?$/.exec(n);
  return m ? (m[1] || '') : n;
};
const badgesFor = (x, m) => {
  const n = x.note || ''; let h = '';
  if (/^Write-off \(/.test(n)) h += ' <span class="badge b-wo">Write-off</span>';
  if (/^Return from location:/.test(n)) h += ' <span class="badge b-ret">Return</span>';
  if (/^Reversal of /.test(n)) h += ' <span class="badge b-rev">Reversal</span>';
  if (m && m.reversed) h += ' <span class="badge b-rev">Reversed</span>';
  return h;
};
function formDlg(title, body, saveLabel, setup){
  return new Promise(res => {
    const d = document.createElement('dialog');
    d.innerHTML = `<form><h3>${esc(title)}</h3>${body}<div class="err" role="alert"></div><div class="row"><button type="button" class="btn light" data-x>Cancel</button><button type="submit" class="btn">${esc(saveLabel)}</button></div></form>`;
    document.body.appendChild(d);
    const f = d.querySelector('form'), err = d.querySelector('.err'), sb = f.querySelector('[type=submit]');
    d.querySelector('[data-x]').onclick = () => d.close();
    d.onclose = () => { const ok = d.returnValue === 'ok'; d.remove(); res(ok); };
    setup({
      q: s => f.querySelector(s),
      run: fn => { f.onsubmit = async e => {
        e.preventDefault(); err.textContent = ''; sb.disabled = true; sb.textContent = 'Saving...';
        let msg = '';
        try { msg = await fn(); } catch (x) { msg = x.message || 'Could not save.'; }
        if (msg) { err.textContent = msg; sb.disabled = false; sb.textContent = saveLabel; } else d.close('ok');
      }; }
    });
    d.returnValue = ''; d.showModal();
  });
}
const pickHtml = '<label>Product</label><input type="search" data-q placeholder="Search by name or code" autocomplete="off"><select data-p size="5" style="margin-top:6px" aria-label="Select product"></select><div class="hint" data-b></div>';
function bindPick(api, info, emptyMsg){
  const q = api.q('[data-q]'), s = api.q('[data-p]'), b = api.q('[data-b]');
  let list = [];
  const show = () => { const p = list.find(x => x.id === s.value); b.textContent = p ? info(p) : (list.length ? 'Select a product.' : (emptyMsg || 'No products available.')); };
  const fill = () => {
    const t = q.value.trim().toLowerCase(), keep = s.value;
    const rows = list.filter(p => !t || p.name.toLowerCase().includes(t) || p.code.toLowerCase().includes(t));
    s.innerHTML = rows.map(p => `<option value="${p.id}">${esc(p.code)} - ${esc(p.name)}</option>`).join('');
    if (rows.some(p => p.id === keep)) s.value = keep; else if (rows.length) s.value = rows[0].id;
    show();
  };
  q.oninput = fill; s.onchange = show;
  return { set: l => { list = l; fill(); }, val: () => s.value };
}
function writeOffDialog(shelf, list, stockMap){
  return formDlg('Write-off - Shelf ' + shelf.name, pickHtml + `
    <label>Reason</label><select data-r><option>Damaged</option><option>Expired</option><option>Lost or missing</option><option>Other</option></select>
    <label>Quantity (pcs)</label><input type="number" data-n min="1" step="1" inputmode="numeric">
    <label>Details (required for Other)</label><textarea data-t rows="2" maxlength="200"></textarea>
    <div class="hint">Removes the quantity from the shelf balance. It is recorded as a write-off and shown separately in reports, not as an issue to a location.</div>`, 'Record write-off', api => {
    const pk = bindPick(api, p => isAdmin() ? 'Current balance on this shelf: ' + (stockMap[p.id] || 0) + ' pcs.' : ''); pk.set(list);
    api.run(async () => {
      const pid = pk.val(), n = parseInt(api.q('[data-n]').value, 10) || 0, r = api.q('[data-r]').value, t = api.q('[data-t]').value.trim();
      if (!pid) return 'Select a product.';
      if (n <= 0) return 'Enter a quantity greater than zero.';
      if (n > (stockMap[pid] || 0)) return 'The quantity is more than the shelf balance.';
      if (r === 'Other' && !t) return 'Enter the details for this write-off.';
      const { error } = await db.rpc('write_off_stock', { p_shelf: shelf.id, p_product: pid, p_pcs: n, p_reason: r, p_note: t || null });
      return error ? (error.message || 'Could not save the write-off.') : '';
    });
  });
}
function returnDialog(shelf, locs, products){
  return formDlg('Return from location - Shelf ' + shelf.name, `<label>Returned by (location)</label><select data-l>${locs.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select>` + pickHtml + `
    <label>Quantity (pcs)</label><input type="number" data-n min="1" step="1" inputmode="numeric">

async function renderLocationDetail(el){
  const { loc } = view;
  const start = new Date(locRange.from + 'T00:00:00+06:00').toISOString();
  const end = new Date(new Date(locRange.to + 'T00:00:00+06:00').getTime() + 86400000).toISOString();
  const [ps, tr, rt] = await Promise.all([
    db.rpc('location_product_summary', { p_location: loc.id, p_from: locRange.from, p_to: locRange.to }),
    db.from('location_transfers').select('created_at,cartons,pcs,total_pcs,mrp,note,issue_no,products(code,name),shelves(name,warehouses(name))')
      .eq('location_id', loc.id).gte('created_at', start).lt('created_at', end).order('created_at', { ascending: false }).limit(500),
    db.rpc('location_returns_list', { p_location: loc.id, p_from: locRange.from, p_to: locRange.to })
  ]);
  if (ps.error) throw ps.error; if (tr.error) throw tr.error;
  const rets = rt.error ? [] : (rt.data || []);
  const sum = ps.data || [], list = tr.data || [];
  const fmt = t => new Date(t).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const tp = sum.reduce((a, x) => a + Number(x.total_pcs), 0), tv = sum.reduce((a, x) => a + Number(x.total_value || 0), 0);
  const from = x => x.shelves ? (x.shelves.warehouses ? x.shelves.warehouses.name + ' / ' : '') + shLbl(x.shelves.name) : '';
  el.innerHTML = `<button class="back" id="bk">&larr; Locations</button>
    <div class="crumb"><h2>${esc(loc.name)}</h2><button class="btn light" id="csv">Download CSV</button></div>
    ${rangeBar()}
    <h3 class="cat">Product-wise total</h3>
    ${sum.length ? `<div class="scroll"><table><thead><tr><th>Code</th><th>Product</th><th class="n">Total pcs</th>${isAdmin() ? '<th class="n">Value (BDT)</th>' : ''}</tr></thead><tbody>
      ${sum.map(x => `<tr><td>${esc(x.product_code)}</td><td>${esc(x.product_name)}</td><td class="n">${n0(x.total_pcs)}</td>${isAdmin() ? `<td class="n">${n0(x.total_value)}</td>` : ''}</tr>`).join('')}
      <tr><th colspan="2">Total</th><th class="n">${n0(tp)}</th>${isAdmin() ? `<th class="n">${n0(tv)}</th>` : ''}</tr></tbody></table></div>`
      : '<div class="empty">No transfers to this location in the selected dates.</div>'}
    <h3 class="cat">Transfer history</h3>
    ${list.length ? `<div class="scroll"><table><thead><tr><th>Date</th><th>Product</th><th>Issue No</th><th>From</th><th class="n">Qty (pcs)</th>${isAdmin() ? '<th class="n">Value (BDT)</th>' : ''}<th>Note</th></tr></thead><tbody>
      ${list.map(x => `<tr><td>${esc(fmt(x.created_at))}</td><td>${esc(x.products ? x.products.code + ' - ' + x.products.name : '')}</td><td>${esc(x.issue_no || '')}</td><td>${esc(from(x))}</td><td class="n">${n0(x.total_pcs)}</td>${isAdmin() ? `<td class="n">${n0(Number(x.total_pcs) * Number(x.mrp))}</td>` : ''}<td>${esc(x.note || '')}</td></tr>`).join('')}</tbody></table></div>
      ${list.length >= 500 ? '<div class="hint">Showing the latest 500 transfers. Narrow the date range to see the rest.</div>' : ''}` : ''}
    ${rets.length ? `<h3 class="cat">Returns from this location</h3><div class="scroll"><table><thead><tr><th>Date</th><th>Product</th><th>Return no</th><th>To</th><th class="n">Qty (pcs)</th>${isAdmin() ? '<th class="n">Value (BDT)</th>' : ''}<th>Note</th></tr></thead><tbody>
      ${rets.map(x => `<tr><td>${esc(fmt(x.created_at))}</td><td>${esc(x.product_code + ' - ' + x.product_name)}</td><td>${esc(x.issue_no || '')}</td><td>${esc(x.warehouse_name + ' / ' + shLbl(x.shelf_name))}</td><td class="n">${n0(x.kind === 'reversal' ? -x.total_pcs : x.total_pcs)}</td>${isAdmin() ? `<td class="n">${n0((x.kind === 'reversal' ? -1 : 1) * Number(x.total_pcs) * Number(x.mrp))}</td>` : ''}<td>${esc((x.kind === 'reversal' ? 'Correction: ' : '') + (x.note || ''))}</td></tr>`).join('')}</tbody></table></div>
      <div class="hint">Returns are already subtracted from the totals above.</div>` : ''}`;
  bindRange();
  $('#bk').onclick = () => go({ t: 'loc' });
  $('#csv').onclick = () => {
    if (!list.length) return toast('No transfers to download.');
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const head = ['Date', 'Location', 'Code', 'Product', 'Issue No', 'From', 'Qty (pcs)'].concat(isAdmin() ? ['MRP', 'Value'] : [], ['Note']);
    const lines = list.map(x => [fmt(x.created_at), loc.name, x.products ? x.products.code : '', x.products ? x.products.name : '', x.issue_no || '', from(x), x.total_pcs]
      .concat(isAdmin() ? [x.mrp, Number(x.total_pcs) * Number(x.mrp)] : [], [x.note || '']).map(q).join(','));
    const blob = new Blob(['\ufeff' + [head.map(q).join(',')].concat(lines).join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = loc.name.replace(/[^\w]+/g, '_') + '_' + locRange.from + '_to_' + locRange.to + '.csv'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
}

/* ---------- Bin Card (paper style) ---------- */
const bcRange = { from: ymd(new Date(new Date().getFullYear(), new Date().getMonth(), 1)), to: ymd(new Date()) };
let bcProd = '';
const dhaka = { timeZone: 'Asia/Dhaka' };
const fmtD = t => new Date(t).toLocaleDateString('en-GB', Object.assign({ day: '2-digit', month: 'short', year: 'numeric' }, dhaka));
const fmtT = t => new Date(t).toLocaleTimeString('en-US', Object.assign({ hour: '2-digit', minute: '2-digit' }, dhaka));
const partyOf = x => {
  if (x.party) return x.party;
  const wm = /^Write-off \(([^)]*)\)/.exec(x.note || ''); if (wm) return 'Write-off - ' + wm[1];
  if (/^Reversal of /.test(x.note || '')) return 'Reversal (correction)';
  const m = /^Transfer (?:to location: |to |from )(.*?)(?: - .*)?$/.exec(x.note || '');
  if (m) return m[1];
  return { opening: 'Opening balance', count: 'Physical count', in: 'Stock in', out: 'Stock out' }[x.entry_type] || '';
};
const qtyCell = n => String(Number(n || 0));

async function renderBinCard(el){
  const { wh, shelf } = view;
  const { data, error } = await db.rpc('shelf_bin_card', { p_shelf: shelf.id, p_from: bcRange.from, p_to: bcRange.to });
  if (error) throw error;
  const all = data || [];
  const meta = new Map();
  try {
    const mr = await rpcAll('bin_card_meta', { p_shelf: shelf.id, p_from: bcRange.from, p_to: bcRange.to });
    mr.forEach(m => meta.set(m.product_code + '|' + new Date(m.entry_time).getTime() + '|' + m.total_pcs + '|' + m.entry_type, m));
  } catch (e) { /* bin card still works without correction tools */ }
  const mt = x => meta.get(x.product_code + '|' + new Date(x.entry_time).getTime() + '|' + x.total_pcs + '|' + x.entry_type);
  const prods = [...new Map(all.map(x => [x.product_code, x.product_name])).entries()].sort((a, b) => a[1].localeCompare(b[1]));
  if (bcProd && !prods.some(x => x[0] === bcProd)) bcProd = '';
  const rows = all.filter(x => !bcProd || x.product_code === bcProd);
  const unaudited = rows.filter(x => !x.audit_name).length;
  const cardFn = x => { const isOut = x.entry_type === 'out';
    const m = mt(x), nt = noteShown(x), n1 = x.note || '';
    const rvOk = isAdmin() && m && !m.reversed && !m.is_reversal && (x.entry_type === 'in' || x.entry_type === 'out') && (!/^Transfer (to|from)/.test(n1) || /^Transfer to location:/.test(n1));
    const bef = Number(x.balance_before), aft = Number(x.balance_after), dl = aft - bef;
    const qLine = isAdmin() && x.balance_before != null ? `<span class="q">${n0(bef)} &rarr; ${n0(aft)}</span><span class="dl ${dl >= 0 ? 'up' : 'dn'}">${dl > 0 ? '+' : ''}${n0(dl)}</span>` : `<span class="q">${n0(x.total_pcs)} pcs</span>`;
    return `<div class="bcc ${m && (m.reversed || m.is_reversal) ? 'rv' : ''}"><div class="bcc-h"><span>${esc(fmtD(x.entry_time))} &middot; ${esc(fmtT(x.entry_time))}</span><span class="ty t-${esc(x.entry_type)}">${esc(typeLbl(x))}</span></div>
      <div class="bcc-p">${esc(x.product_code)} - ${esc(x.product_name)}</div>
      <div class="bcc-q">${qLine}</div>
      <div class="bcc-m">${esc(partyOf(x))}${badgesFor(x, m)}${x.issue_no ? ' &middot; ' + esc(x.issue_no) : ''}</div>
      ${nt ? `<div class="bcc-n">${esc(nt)}</div>` : ''}
      <div class="bcc-f"><span>${esc(x.concern_name || '')}</span><span>${x.audit_name ? I('check') + ' Audited' : ''}</span>${rvOk ? `<button class="btn ghost" data-rv="${esc(m.entry_id)}" style="color:var(--err);padding:4px 10px;font-size:12px">Reverse</button>` : ''}</div></div>`; };
  el.innerHTML = `<button class="back" id="bk">&larr; ${esc(shLbl(shelf.name))}</button>
    <div class="noprint">
      <div class="row"><div style="flex:1"><label for="bf">From</label><input type="date" id="bf" value="${bcRange.from}"></div>
        <div style="flex:1"><label for="bt">To</label><input type="date" id="bt" value="${bcRange.to}"></div>
        <div style="flex:1.5"><label for="bp">Product</label><select id="bp"><option value="">All products</option>${prods.map(x => `<option value="${esc(x[0])}" ${x[0] === bcProd ? 'selected' : ''}>${esc(x[0])} - ${esc(x[1])}</option>`).join('')}</select></div></div>
      <div class="row" style="margin:10px 0 14px">
        <button class="btn light" id="bm">This month</button><button class="btn light" id="ba">All time</button>
        <button class="btn" id="bpr">Print</button><button class="btn light" id="bcsv">Download CSV</button>
        ${isAdmin() ? `<button class="btn light" id="bau">Mark all audited${unaudited ? ' (' + unaudited + ')' : ''}</button>` : ''}
      </div>
    </div>
    <div class="paperhead">
      <div><b style="font-size:18px">Ultimate Organic Life Ltd.</b><small>Noor Tower H#29/31, R#01, B#D, Sec# 02, Aftabnagar, Badda, Dhaka-1212</small></div>
      <div><b>Warehouse :</b> ${esc(wh.name)}<br><b>Shelf No :</b> ${esc(shelf.name)}</div>
      <div><b>Bin Card :</b> ${esc(shLbl(shelf.name))}<small>${esc(bcRange.from)} to ${esc(bcRange.to)}</small></div>
    </div>
    ${rows.length ? `<div class="scroll bcT"><table class="bc bcard"><thead><tr><th>Date</th><th>Time</th><th>Product Name</th>${isAdmin() ? '<th class="n">Opening Qty</th>' : ''}<th>Department / Supplier / Location</th><th>Issue No</th><th class="n">Issued Qty (Transfer)</th><th class="n">Received Qty (Stock in)</th>${isAdmin() ? '<th class="n">Closing Qty</th>' : ''}<th>Concern Person</th><th>Audit Person</th>${isAdmin() ? '<th class="noprint">Action</th>' : ''}</tr></thead><tbody>
      ${rows.map(x => { const per = x.pcs_per_carton || 1, isOut = x.entry_type === 'out', isIn = x.entry_type === 'in';
        const m = mt(x), nt = noteShown(x), n1 = x.note || '';
        const rvOk = isAdmin() && m && !m.reversed && !m.is_reversal && (x.entry_type === 'in' || x.entry_type === 'out') && (!/^Transfer (to|from)/.test(n1) || /^Transfer to location:/.test(n1));
        return `<tr class="${m && (m.reversed || m.is_reversal) ? 'rv' : ''}"><td>${esc(fmtD(x.entry_time))}</td><td>${esc(fmtT(x.entry_time))}</td><td class="w">${esc(x.product_code)} - ${esc(x.product_name)}</td>
        ${isAdmin() ? `<td class="n">${qtyCell(x.balance_before, per)}</td>` : ''}
        <td class="w">${esc(partyOf(x))}${badgesFor(x, m)}${nt ? `<small>${esc(nt)}</small>` : ''}</td><td>${esc(x.issue_no || '')}</td>
        <td class="n">${isOut ? qtyCell(x.total_pcs, per) : ''}</td><td class="n">${isIn ? qtyCell(x.total_pcs, per) : ''}</td>
        ${isAdmin() ? `<td class="n"><b>${qtyCell(x.balance_after, per)}</b></td>` : ''}
        <td class="w">${esc(x.concern_name || '')}</td><td class="w">${x.audit_name ? esc(x.audit_name) + `<small>${esc(fmtD(x.audit_time))}</small>` : ''}</td>${isAdmin() ? `<td class="noprint">${rvOk ? `<button class="btn ghost" data-rv="${esc(m.entry_id)}" style="color:var(--err);padding:4px 8px;font-size:12px">Reverse</button>` : ''}</td>` : ''}</tr>`; }).join('')}
      </tbody></table></div><div class="bcl noprint">${rows.map(cardFn).join('')}</div>${all.length >= 1000 ? '<div class="hint noprint">Showing the latest 1000 entries of this period. Narrow the dates to see earlier entries.</div>' : ''}`
      : '<div class="empty">No entries in the selected dates.</div>'}
    <div class="papersign"><span>Prepared By</span><span>Checked by</span><span>Approved by</span></div>`;
  $('#bk').onclick = () => go({ t: 'shelf', wh, shelf });
  $('#bf').onchange = e => { if (e.target.value) { bcRange.from = e.target.value; render(); } };
  $('#bt').onchange = e => { if (e.target.value) { bcRange.to = e.target.value; render(); } };
  $('#bp').onchange = e => { bcProd = e.target.value; render(); };
  el.querySelectorAll('[data-rv]').forEach(b => b.onclick = async () => {
    const row = rows.find(x => { const m = mt(x); return m && m.entry_id === b.dataset.rv; });
    if (row && await reverseDialog(b.dataset.rv, row)) { toast('Entry reversed. A reversal entry was added to the bin card.'); render(); }
  });
  $('#bm').onclick = () => { const n = new Date(); bcRange.from = ymd(new Date(n.getFullYear(), n.getMonth(), 1)); bcRange.to = ymd(n); render(); };
  $('#ba').onclick = () => { bcRange.from = '2020-01-01'; bcRange.to = ymd(new Date()); render(); };
  $('#bpr').onclick = () => window.print();
  $('#bcsv').onclick = () => {
    if (!rows.length) return toast('No entries to download.');
    const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
    const head = ['Date', 'Time', 'Product Name', 'Opening Qty', 'Department/Supplier/Location', 'Issue No', 'Issued Qty', 'Received Qty', 'Closing Qty', 'Concern Person', 'Audit Person', 'Note'];
    const lines = rows.map(x => [fmtD(x.entry_time), fmtT(x.entry_time), x.product_code + ' - ' + x.product_name, isAdmin() ? x.balance_before : '', partyOf(x), x.issue_no || '',
      x.entry_type === 'out' ? x.total_pcs : '', x.entry_type === 'in' ? x.total_pcs : '', isAdmin() ? x.balance_after : '', x.concern_name || '', x.audit_name || '', x.note || ''].map(q).join(','));
    const blob = new Blob(['\ufeff' + [head.map(q).join(',')].concat(lines).join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'BinCard_' + wh.name.replace(/[^\w]+/g, '_') + '_Shelf_' + shelf.name.replace(/[^\w]+/g, '_') + '_' + bcRange.from + '_to_' + bcRange.to + '.csv'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const au = $('#bau');
  if (au) au.onclick = async () => {
    if (!confirm('Mark all unaudited entries of this shelf as audited by you?')) return;
    const { data: n, error: e } = await db.rpc('audit_shelf_entries', { p_shelf: shelf.id });
    if (e) return toast(e.message || 'Could not mark entries as audited.');
    toast(n + ' entries marked as audited.'); render();
  };
}

/* ---------- Users (master / admin) ---------- */
const ROLE_LABEL = { master: 'Master', admin: 'Admin', employee: 'Employee' };
async function callUsers(body){
  const { data, error } = await db.functions.invoke('manage-users', { body });
  if (error) {
    let m = 'The user service is not available. Check that the manage-users function is deployed.';
    try { const j = await error.context.json(); if (j && j.error) m = j.error; } catch (e) {}
    throw new Error(m);
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}

function userDialog(mode, u){
  return new Promise(res => {
    const d = $('#udlg'), err = $('#uErr'), save = $('#uSave'), roleSel = $('#uRole');
    const edit = mode === 'edit';
    $('#uTitle').textContent = edit ? 'Edit user' : 'Add user';
    $('#uName').value = edit ? (u.full_name || '') : '';
    $('#uEmail').value = edit ? u.email : ''; $('#uEmail').disabled = edit;
    $('#uPass').value = ''; $('#uPassL').textContent = edit ? 'New password (leave empty to keep the current one)' : 'Password';
    const roles = me.role === 'master' ? ['employee', 'admin', 'master'] : ['employee'];
    roleSel.innerHTML = roles.map(r => `<option value="${r}">${ROLE_LABEL[r]}</option>`).join('');
    roleSel.value = edit && roles.includes(u.role) ? u.role : 'employee';
    $('#uHint').textContent = edit ? 'Share a new password with the user directly.' : 'Share this email and password with the user directly.';
    err.textContent = ''; save.disabled = false; save.textContent = 'Save';
    $('#uCancel').onclick = () => d.close();
    $('#uForm').onsubmit = async e => {
      e.preventDefault(); err.textContent = '';
      const name = $('#uName').value.trim(), email = $('#uEmail').value.trim().toLowerCase(), pass = $('#uPass').value;
      if (!name) { err.textContent = 'Enter the full name.'; return; }
      if (!edit && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'Enter a valid email address.'; return; }
      if ((!edit || pass) && pass.length < 8) { err.textContent = 'Password must be at least 8 characters.'; return; }
      save.disabled = true; save.textContent = 'Saving...';
      try {
        if (edit) {
          const body = { action: 'update', id: u.id, full_name: name, role: roleSel.value };
          if (pass) body.password = pass;
          await callUsers(body);
        } else {
          await callUsers({ action: 'create', full_name: name, email, password: pass, role: roleSel.value });
        }
        d.close('ok');
      } catch (x) { err.textContent = x.message; save.disabled = false; save.textContent = 'Save'; }
    };
    d.onclose = () => res(d.returnValue === 'ok');
    d.returnValue = ''; d.showModal();
  });
}

async function renderUsers(el){
  if (!isAdmin()) { el.innerHTML = '<div class="empty">You do not have access to this page.</div>'; return; }
  const r = await callUsers({ action: 'list' });
  const users = r.users || [];
  const byId = Object.fromEntries(users.map(x => [x.id, x]));
  el.innerHTML = `<div class="crumb"><h2>Users</h2><button class="btn" id="addUser">Add user</button></div>
    <div class="list">${users.length ? users.map(x => `<div class="item ${x.is_active ? '' : 'off'}" style="cursor:default">
      <span class="grow"><b>${esc(x.full_name || x.email)}</b><span class="sub">${esc(x.email || '')} &middot; ${esc(ROLE_LABEL[x.role] || x.role)}${x.id === me.id ? ' &middot; You' : ''}</span></span>
      ${x.is_active ? '' : '<span class="tag">Deactivated</span>'}
      ${x.can_manage ? `<button class="btn ghost" data-ed="${x.id}" style="color:var(--pri)">Edit</button><button class="btn ghost" data-tg="${x.id}" style="color:var(--pri)">${x.is_active ? 'Deactivate' : 'Activate'}</button>` : ''}</div>`).join('') : '<div class="empty">No users found.</div>'}</div>
    <div class="hint">${me.role === 'master' ? 'Master can manage admin and employee accounts.' : 'Admin can manage employee accounts.'} A deactivated user cannot sign in.</div>`;
  $('#addUser').onclick = async () => { if (await userDialog('add')) { toast('User created.'); render(); } };
  el.querySelectorAll('[data-ed]').forEach(b => b.onclick = async () => { if (await userDialog('edit', byId[b.dataset.ed])) { toast('User updated.'); render(); } });
  el.querySelectorAll('[data-tg]').forEach(b => b.onclick = async () => {
    const x = byId[b.dataset.tg], on = !x.is_active;
    if (!confirm((on ? 'Activate ' : 'Deactivate ') + (x.full_name || x.email) + '?')) return;
    try { await callUsers({ action: 'update', id: x.id, is_active: on }); toast(on ? 'User activated.' : 'User deactivated.'); render(); }
    catch (e) { toast(e.message); }
  });
}

const repRange = { from: ymd(new Date(new Date().getFullYear(), new Date().getMonth(), 1)), to: ymd(new Date()) };
const REPIC = { ledger: "book", location: "pin", count: "count", supplier: "in", issue: "search", activity: "user", audit: "check", movement: "chart", wcountres: "count", countres: "count", reorder: "alert", writeoff: "trash", corrections: "ret" };
const REPORTS = [
  { k: 'ledger', t: 'Stock ledger', d: 'Opening, received, issued and closing stock for any period' },
  { k: 'location', t: 'Location analysis', d: 'Location x product matrix and month-to-month comparison' },
  { k: 'count', t: 'Physical count variance', d: 'Mismatches, shortage and excess value, and results by employee' },
  { k: 'supplier', t: 'Supplier-wise stock in', d: 'Quantity, value and number of receipts per supplier' },
  { k: 'issue', t: 'Issue no search', d: 'Find every entry that carries an issue no' },

  { k: 'audit', t: 'Audit pending', d: 'Entries that are not audited yet, by shelf' },

  { k: 'corrections', t: 'Reversals and returns', d: 'Corrected entries with reasons, and returns from locations' }

const nz = v => Number(v || 0);
const money = v => '&#2547; ' + n0(v);
const tblHead = cols => '<thead><tr>' + cols.map(c => c[0] === '>' ? `<th class="n">${esc(c.slice(1))}</th>` : `<th>${esc(c)}</th>`).join('') + '</tr></thead>';
const KI = [[/stock in/i, 'in'], [/issued/i, 'out'], [/mismatch/i, 'count'], [/audit/i, 'check'], [/written/i, 'trash'], [/returned/i, 'ret'], [/minimum|low/i, 'alert'], [/value|total|received/i, 'box']];
const kpi = (label, big, sub = '', cls = '') => { const k = KI.find(x => x[0].test(label)); return `<div class="kpi ${cls}">${k ? `<span class="ki">${I(k[1])}</span>` : ''}<span>${esc(label)}</span><b>${big}</b>${sub ? `<small>${sub}</small>` : ''}</div>`; };
const monthLbl = k => new Date(k + '-01T00:00:00').toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
async function rpcAll(name, args){
  let all = [], from = 0;
  for (let i = 0; i < 30; i++) {
    const { data, error } = await db.rpc(name, args).range(from, from + 999);
    if (error) throw error;
    all = all.concat(data || []);
    if (!data || data.length < 1000) break;
    from += 1000;
  }
  return all;
}
function saveCsv(name, head, rows){
  if (!rows.length) return toast('Nothing to download.');
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const blob = new Blob(['\ufeff' + [head.map(q).join(',')].concat(rows.map(r => r.map(q).join(','))).join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = name + '_' + repRange.from + '_to_' + repRange.to + '.csv'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const repHead = (title, o = {}) => `<button class="back" id="bk">&larr; Reports</button>
  <div class="crumb"><h2>${esc(title)}</h2><span class="noprint" style="display:flex;gap:8px"><button class="btn light" id="prn">Print</button>${o.csv === false ? '' : '<button class="btn light" id="csv">Download CSV</button>'}</span></div>
  <div class="noprint">${o.range === false ? '' : `<div class="row"><div style="flex:1"><label for="rpf">From</label><input type="date" id="rpf" value="${repRange.from}"></div><div style="flex:1"><label for="rpt">To</label><input type="date" id="rpt" value="${repRange.to}"></div></div>`}${o.extra || ''}</div>`;
function repBind(csvFn){
  $('#bk').onclick = () => go({ t: 'reports' });
  $('#prn').onclick = () => window.print();
  const c = $('#csv'); if (c) c.onclick = csvFn;
  const f = $('#rpf'), t = $('#rpt');

  if (t) t.onchange = e => { if (e.target.value) { repRange.to = e.target.value; render(); } };
}
