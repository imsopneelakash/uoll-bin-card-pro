/* --- Stock ledger --- */
let ledMode = 'product', ledWh = '', ledQ = '';
const LK = ['op', 'rec', 'ret', 'iss', 'wo', 'mi', 'mo', 'cor', 'adj', 'cl', 'val'];
const LH = ['Opening', 'Received', 'Returned from locations', 'Issued', 'Written off', 'Shelf transfer in', 'Shelf transfer out', 'Corrections (reversals)', 'Adjustment', 'Closing', 'Closing value (BDT)'];
async function repLedger(el){
  const [wl, rows] = await Promise.all([db.from('warehouses').select('id,name').order('name'),
    rpcAll('report_stock_ledger', { p_from: repRange.from, p_to: repRange.to, p_warehouse: ledWh || null })]);
  if (wl.error) throw wl.error;
  const q = ledQ.trim().toLowerCase();
  const list = rows.filter(r => !q || r.product_code.toLowerCase().includes(q) || r.product_name.toLowerCase().includes(q));
  const g = new Map();
  list.forEach(r => {
    const shelf = r.warehouse_name + ' / ' + shLbl(r.shelf_name), prod = r.product_code + ' - ' + r.product_name;
    const k = ledMode === 'product' ? r.product_code : ledMode === 'shelf' ? shelf : r.product_code + '|' + shelf;
    let o = g.get(k); if (!o) { o = { a: ledMode === 'shelf' ? shelf : prod, b: shelf }; LK.forEach(f => o[f] = 0); g.set(k, o); }
    o.op += nz(r.opening); o.rec += nz(r.received); o.ret += nz(r.returned); o.iss += nz(r.issued); o.wo += nz(r.written_off);
    o.mi += nz(r.moved_in); o.mo += nz(r.moved_out); o.cor += nz(r.corrections); o.cl += nz(r.closing); o.val += nz(r.closing) * nz(r.mrp);
  });
  const out = [...g.values()].sort((a, b) => a.a.localeCompare(b.a) || a.b.localeCompare(b.b));
  out.forEach(o => o.adj = o.cl - o.op - o.rec - o.ret + o.iss + o.wo - o.mi + o.mo - o.cor);
  const T = out.reduce((t, o) => { LK.forEach(f => t[f] += o[f]); return t; }, Object.fromEntries(LK.map(f => [f, 0])));
  const lead = ledMode === 'detail' ? ['Product', 'Shelf'] : [ledMode === 'shelf' ? 'Shelf' : 'Product'];
  const extra = `<div class="row" style="margin-top:10px">${sel('lw', 'Warehouse', [['', 'All warehouses']].concat(wl.data.map(w => [w.id, w.name])), ledWh)}
    ${sel('lm', 'View', [['product', 'Product wise'], ['shelf', 'Shelf wise'], ['detail', 'Product by shelf']], ledMode)}
    <div style="flex:1"><label for="lq">Search product</label><input type="search" id="lq" value="${esc(ledQ)}" placeholder="Name or code"></div></div>`;
  const cell = o => (ledMode === 'detail' ? `<td>${esc(o.a)}</td><td>${esc(o.b)}</td>` : `<td>${esc(o.a)}</td>`);
  const nums = (o, th) => LK.map(f => th ? `<th class="n">${n0(o[f])}</th>` : (f === 'cl' ? `<td class="n"><b>${n0(o[f])}</b></td>` : `<td class="n">${n0(o[f])}</td>`)).join('');
  el.innerHTML = repHead('Stock ledger', { extra }) + `<div class="hint">All quantities are in pcs. Received = stock in from suppliers. Returned = taken back from locations. Issued = stock out to locations. Written off = damaged, expired or lost stock. Corrections = reversals of wrong entries. Adjustment = physical count and opening balance changes.</div>
    ${out.length ? `<div class="scroll"><table class="bc">${tblHead(lead.concat(LH.map(h => '>' + h)))}<tbody>
    ${out.map(o => `<tr>${cell(o)}${nums(o, false)}</tr>`).join('')}
    <tr><th colspan="${lead.length}">Total</th>${nums(T, true)}</tr></tbody></table></div>` : '<div class="empty">No stock movement found.</div>'}`;
  repBind(() => saveCsv('Stock_ledger_' + ledMode, lead.concat(LH.slice(0, 10), ['Closing value']),
    out.map(o => (ledMode === 'detail' ? [o.a, o.b] : [o.a]).concat(LK.map(f => f === 'val' ? Math.round(o.val) : o[f])))));
  $('#lw').onchange = e => { ledWh = e.target.value; render(); };
  $('#lm').onchange = e => { ledMode = e.target.value; render(); };
  $('#lq').onchange = e => { ledQ = e.target.value; render(); };
}

/* --- Location analysis --- */
let locMode = 'matrix', locMeasure = 'pcs', locMonths = '6';
async function repLocation(el){
  const modeSel = sel('lmode', 'View', [['matrix', 'Product x location'], ['month', 'Month by month']], locMode) + sel('lmeas', 'Show', [['pcs', 'Quantity (pcs)'], ['value', 'Value (BDT)']], locMeasure)
    + (locMode === 'month' ? sel('lmon', 'Months', [['3', 'Last 3 months'], ['6', 'Last 6 months'], ['12', 'Last 12 months']], locMonths) : '');
  const extra = `<div class="row" style="margin-top:10px">${modeSel}</div>`;
  const pick = r => locMeasure === 'value' ? nz(r.total_value) : nz(r.total_pcs);
  const bindSel = () => {
    $('#lmode').onchange = e => { locMode = e.target.value; render(); };
    $('#lmeas').onchange = e => { locMeasure = e.target.value; render(); };
    const m = $('#lmon'); if (m) m.onchange = e => { locMonths = e.target.value; render(); };
  };
  if (locMode === 'matrix') {
    const rows = await rpcAll('report_location_matrix', { p_from: repRange.from, p_to: repRange.to });
    const locs = new Map(), prods = new Map(), cell = new Map();
    rows.forEach(r => { const v = pick(r), pk = r.product_code + ' - ' + r.product_name;
      locs.set(r.location_name, (locs.get(r.location_name) || 0) + v); prods.set(pk, (prods.get(pk) || 0) + v); cell.set(pk + '|' + r.location_name, v); });
    const L = [...locs.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]), P = [...prods.entries()].sort((a, b) => b[1] - a[1]);
    const total = P.reduce((a, x) => a + x[1], 0);
    el.innerHTML = repHead('Location analysis', { extra }) + (P.length ? `<div class="hint">Products are sorted by total, locations by total (highest first).</div>
      <div class="scroll"><table class="bc"><thead><tr><th class="stick">Product</th>${L.map(l => `<th class="n">${esc(l)}</th>`).join('')}<th class="n">Total</th></tr></thead><tbody>
      ${P.map(([pk, tv]) => `<tr><td class="stick w">${esc(pk)}</td>${L.map(l => `<td class="n">${cell.has(pk + '|' + l) ? n0(cell.get(pk + '|' + l)) : ''}</td>`).join('')}<td class="n"><b>${n0(tv)}</b></td></tr>`).join('')}
      <tr><th class="stick">Total</th>${L.map(l => `<th class="n">${n0(locs.get(l))}</th>`).join('')}<th class="n">${n0(total)}</th></tr></tbody></table></div>` : '<div class="empty">No transfers to locations in the selected dates.</div>');
    repBind(() => saveCsv('Location_matrix_' + locMeasure, ['Product'].concat(L, ['Total']), P.map(([pk, tv]) => [pk].concat(L.map(l => cell.get(pk + '|' + l) ?? ''), [tv]))));
  } else {
    const rows = await rpcAll('report_location_monthly', { p_months: parseInt(locMonths, 10) });
    const months = [...new Set(rows.map(r => r.month_key))].sort(), byLoc = new Map();
    rows.forEach(r => { let o = byLoc.get(r.location_name); if (!o) { o = {}; byLoc.set(r.location_name, o); } o[r.month_key] = pick(r); });
    const list = [...byLoc.entries()].sort((a, b) => a[0].localeCompare(b[0]));
    const chg = o => { const n = months.length; if (n < 2) return ''; const a = nz(o[months[n - 2]]), b = nz(o[months[n - 1]]); return a > 0 ? ((b - a) / a * 100).toFixed(0) + '%' : (b > 0 ? 'New' : ''); };
    el.innerHTML = repHead('Location analysis', { extra, range: false }) + (list.length ? `<div class="hint">Change compares the latest month with the month before it.</div>
      <div class="scroll"><table class="bc"><thead><tr><th class="stick">Location</th>${months.map(m => `<th class="n">${esc(monthLbl(m))}</th>`).join('')}<th class="n">Change</th></tr></thead><tbody>
      ${list.map(([l, o]) => `<tr><td class="stick">${esc(l)}</td>${months.map(m => `<td class="n">${o[m] ? n0(o[m]) : ''}</td>`).join('')}<td class="n">${esc(chg(o))}</td></tr>`).join('')}
      <tr><th class="stick">Total</th>${months.map(m => `<th class="n">${n0(list.reduce((a, [, o]) => a + nz(o[m]), 0))}</th>`).join('')}<th></th></tr></tbody></table></div>` : '<div class="empty">No transfers to locations in this period.</div>');
    repBind(() => saveCsv('Location_monthly_' + locMeasure, ['Location'].concat(months, ['Change']), list.map(([l, o]) => [l].concat(months.map(m => o[m] ?? ''), [chg(o)]))));
  }
  bindSel();
}

/* --- Physical count variance --- */
let cntOnly = '1';
async function repCount(el){
  const rows = await rpcAll('report_count_variance', { p_from: repRange.from, p_to: repRange.to });
  const diff = r => nz(r.counted_pcs) - nz(r.system_pcs);
  const bad = rows.filter(r => diff(r) !== 0), good = rows.length - bad.length;
  let shortP = 0, shortV = 0, exP = 0, exV = 0;
  bad.forEach(r => { const d = diff(r), v = d * nz(r.mrp); if (d < 0) { shortP += -d; shortV += -v; } else { exP += d; exV += v; } });
  const by = new Map();
  rows.forEach(r => { let o = by.get(r.counted_by); if (!o) { o = { n: 0, bad: 0, sp: 0, sv: 0, ep: 0, ev: 0 }; by.set(r.counted_by, o); }
    o.n++; const d = diff(r); if (d !== 0) { o.bad++; if (d < 0) { o.sp += -d; o.sv += -d * nz(r.mrp); } else { o.ep += d; o.ev += d * nz(r.mrp); } } });
  const people = [...by.entries()].sort((a, b) => b[1].bad - a[1].bad);
  const shown = cntOnly === '1' ? bad : rows;
  const extra = `<div class="row" style="margin-top:10px">${sel('cshow', 'List', [['1', 'Mismatches only'], ['0', 'All counts']], cntOnly)}</div>`;
  el.innerHTML = repHead('Physical count variance', { extra }) + `<div class="kpis">
    ${kpi('Counts', n0(rows.length))}${kpi('Match', n0(good), '', 'good')}${kpi('Mismatch', n0(bad.length), rows.length ? (bad.length / rows.length * 100).toFixed(1) + '% of counts' : '', bad.length ? 'bad' : 'good')}
    ${kpi('Shortage', n0(shortP) + ' pcs', money(shortV), shortP ? 'bad' : '')}${kpi('Excess', n0(exP) + ' pcs', money(exV))}</div>
    <h3 class="cat">Results by employee</h3>
    ${people.length ? `<div class="scroll"><table class="bc">${tblHead(['Counted by', '>Counts', '>Mismatches', '>Mismatch rate', '>Shortage (pcs)', '>Shortage (BDT)', '>Excess (pcs)', '>Excess (BDT)'])}<tbody>
    ${people.map(([n, o]) => `<tr><td>${esc(n)}</td><td class="n">${o.n}</td><td class="n">${o.bad}</td><td class="n">${(o.bad / o.n * 100).toFixed(0)}%</td><td class="n">${n0(o.sp)}</td><td class="n">${n0(o.sv)}</td><td class="n">${n0(o.ep)}</td><td class="n">${n0(o.ev)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No physical counts in the selected dates.</div>'}
    <h3 class="cat">${cntOnly === '1' ? 'Mismatches' : 'All counts'}</h3>
    ${shown.length ? `<div class="scroll"><table class="bc">${tblHead(['Date', 'Shelf', 'Product', '>System', '>Counted', '>Difference', '>Value (BDT)', 'Counted by'])}<tbody>
    ${shown.map(r => { const d = diff(r); return `<tr><td>${esc(fmtD(r.count_time))} ${esc(fmtT(r.count_time))}</td><td class="w">${esc(r.warehouse_name)} / ${esc(shLbl(r.shelf_name))}</td><td class="w">${esc(r.product_code)} - ${esc(r.product_name)}</td><td class="n">${n0(r.system_pcs)}</td><td class="n">${n0(r.counted_pcs)}</td><td class="n" style="color:${d < 0 ? 'var(--err)' : d > 0 ? 'var(--pri)' : 'inherit'}">${d > 0 ? '+' : ''}${n0(d)}</td><td class="n">${n0(d * nz(r.mrp))}</td><td>${esc(r.counted_by)}</td></tr>`; }).join('')}</tbody></table></div>` : '<div class="empty">Nothing to show.</div>'}`;
  repBind(() => saveCsv('Count_variance', ['Date', 'Warehouse', 'Shelf', 'Product', 'System', 'Counted', 'Difference', 'Value', 'Counted by'],
    shown.map(r => [fmtD(r.count_time) + ' ' + fmtT(r.count_time), r.warehouse_name, r.shelf_name, r.product_code + ' - ' + r.product_name, r.system_pcs, r.counted_pcs, diff(r), diff(r) * nz(r.mrp), r.counted_by])));
  $('#cshow').onchange = e => { cntOnly = e.target.value; render(); };
}

    o.n += nz(r.entries); o.pcs += nz(r.total_pcs); o.val += nz(r.total_value); if (r.last_in > o.last) o.last = r.last_in; o.items.push(r); });

async function renderWhVerify(el){

    ${pend.length ? `<div class="scroll"><table class="bc">${tblHead(['Counted on', 'Warehouse', 'Product', 'Counted by', '>Counted', '>System', '>Difference', '>Value (BDT)', '>Round', ''])}<tbody>

      <td class="n" style="color:${d ? 'var(--err)' : 'var(--pri)'}"><b>${d ? sgn(d) : 'Match'}</b></td><td class="n">${d ? sgn(d * nz(r.mrp)) : ''}</td><td class="n">${r.rounds}</td>
      <td style="white-space:nowrap">${d === 0 ? `<button class="btn" data-wv="${r.item_id}" style="padding:4px 10px;font-size:13px">Verify</button> ` : `<button class="btn light" data-wac="${r.item_id}" style="padding:4px 10px;font-size:13px">Accept difference</button> `}<button class="btn ghost" data-wrc="${r.item_id}" style="color:var(--err);padding:4px 10px;font-size:13px">Recount</button></td></tr>`; }).join('')}</tbody></table></div>` : '<div class="empty">No warehouse counts are waiting for verification.</div>'}
    ${wait.length ? `<div class="hint">Waiting for recount: ${wait.map(r => esc(r.warehouse_name) + ' - ' + esc(r.product_name)).join('; ')}</div>` : ''}`;
  const verify = async ids => {

    if (e) return toast(e.message || 'Could not verify.');

  };
  const va = el.querySelector('#wvall'); if (va) va.onclick = () => { va.disabled = true; verify(ok.map(r => r.item_id)); };
  el.querySelectorAll('[data-wv]').forEach(b => b.onclick = () => { b.disabled = true; verify([b.dataset.wv]); });
  el.querySelectorAll('[data-wac]').forEach(b => b.onclick = async () => {
    const r = pend.find(x => x.item_id === b.dataset.wac), d = diff(r);
    const { data: sh } = await db.rpc('wcount_shelf_breakdown', { p_wh: r.warehouse_id, p_product: r.product_id });
    const okd = await formDlg('Accept difference', `<div class="hint" style="margin:0 0 10px"><b>${esc(r.product_code)} - ${esc(r.product_name)}</b><br>${esc(r.warehouse_name)}: system ${n0(r.system_pcs)} pcs, counted ${n0(r.counted_pcs)} pcs (${sgn(d)} pcs, BDT ${sgn(d * nz(r.mrp))})</div>
      <label>Apply the difference to a shelf</label><select data-s><option value="">Do not change shelf stock (record the difference only)</option>${(sh || []).map(s => `<option value="${s.shelf_id}">${esc(shLbl(s.shelf_name))} (now ${n0(s.qty_pcs)} pcs)</option>`).join('')}</select>
      <div class="hint">If you choose a shelf, its balance is changed by ${sgn(d)} pcs and a count entry is added to that shelf bin card. Otherwise only the result is recorded and shelf stock stays as it is.</div>`, 'Accept difference', api => {

/* ---------- Warehouse stock overview (master / admin) ---------- */
let wsQ = '';
async function renderWhStock(el){
  if (!isAdmin()) { el.innerHTML = '<div class="empty">You do not have access to this page.</div>'; return; }
  const { wh } = view;
  const sh = await db.from('shelves').select('id,name,is_active').eq('warehouse_id', wh.id).order('name');
  if (sh.error) throw sh.error;
  const shelves = sh.data || [];
  let rows = [];
  if (shelves.length) {
    const st = await db.from('stock').select('shelf_id,qty_pcs,products(id,code,name,mrp)').in('shelf_id', shelves.map(s => s.id)).gt('qty_pcs', 0);
    if (st.error) throw st.error;
    rows = (st.data || []).filter(r => r.products);
  }
  const g = new Map();
  rows.forEach(r => {
    const p = r.products; let o = g.get(p.id);
    if (!o) { o = { code: p.code, name: p.name, mrp: Number(p.mrp || 0), tot: 0, by: {} }; g.set(p.id, o); }
    o.tot += Number(r.qty_pcs); o.by[r.shelf_id] = (o.by[r.shelf_id] || 0) + Number(r.qty_pcs);
  });
  const q = wsQ.trim().toLowerCase();
  const list = [...g.values()].filter(o => !q || o.name.toLowerCase().includes(q) || String(o.code).toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
  const tp = list.reduce((a, o) => a + o.tot, 0), tv = list.reduce((a, o) => a + o.tot * o.mrp, 0);
  const shelfTot = s => list.reduce((a, o) => a + (o.by[s.id] || 0), 0);
  el.innerHTML = `<button class="back" id="bk">&larr; ${esc(wh.name)}</button>
    <div class="crumb"><h2>Current stock - ${esc(wh.name)}</h2><button class="btn light" id="wsCsv">Download CSV</button></div>
    <div class="kpis">${kpi('Products in stock', n0(list.length))}${kpi('Total quantity', n0(tp) + ' pcs')}${kpi('Stock value', money(tv), 'at MRP')}</div>
    <div style="margin:10px 0"><input type="search" id="wsq" value="${esc(wsQ)}" placeholder="Search product name or code" aria-label="Search product"></div>
    ${list.length ? `<div class="scroll"><table class="bc">${tblHead(['Code', 'Product'].concat(shelves.map(s => '>' + shLbl(s.name)), ['>Total (pcs)', '>Value (BDT)']))}<tbody>
    ${list.map(o => `<tr><td>${esc(o.code)}</td><td class="w">${esc(o.name)}</td>${shelves.map(s => `<td class="n">${o.by[s.id] ? n0(o.by[s.id]) : '-'}</td>`).join('')}<td class="n"><b>${n0(o.tot)}</b></td><td class="n">${n0(o.tot * o.mrp)}</td></tr>`).join('')}
    <tr><th colspan="2">Total</th>${shelves.map(s => `<th class="n">${n0(shelfTot(s))}</th>`).join('')}<th class="n">${n0(tp)}</th><th class="n">${n0(tv)}</th></tr></tbody></table></div>` : '<div class="empty">No stock in this warehouse yet.</div>'}`;
  $('#bk').onclick = () => go({ t: 'shelves', wh });
  $('#wsq').onchange = e => { wsQ = e.target.value; render(); };
  $('#wsCsv').onclick = () => saveCsv('Stock_' + wh.name.replace(/\W+/g, '_'), ['Code', 'Product'].concat(shelves.map(s => shLbl(s.name)), ['Total (pcs)', 'Value (MRP)']),
    list.map(o => [o.code, o.name].concat(shelves.map(s => o.by[s.id] || 0), [o.tot, Math.round(o.tot * o.mrp)])));
}

async function refreshBadge(){
  if (!me || !isAdmin()) return;

const fmtDT = t => fmtD(t) + ' ' + fmtT(t);
async function renderVerifyShelf(el){
  if (!isAdmin()) { el.innerHTML = '<div class="empty">You do not have access to this page.</div>'; return; }
  const { data, error } = await db.rpc('count_admin_list');
  if (error) throw error;
  const rows = data || [];
  const pend = rows.filter(r => r.status === 'pending'), wait = rows.filter(r => r.status === 'recount');
  const diff = r => nz(r.counted_pcs) - nz(r.system_pcs);
  const ok = pend.filter(r => diff(r) === 0);
  const sgn = v => (v > 0 ? '+' : '') + n0(v);
  el.innerHTML = `<div class="crumb"><h2>Count verification</h2></div>
    <div class="kpis">${kpi('Awaiting verification', n0(pend.length), '', pend.length ? 'warn' : 'good')}${kpi('Counts that match', n0(ok.length), '', 'good')}${kpi('Differences', n0(pend.length - ok.length), '', pend.length - ok.length ? 'bad' : 'good')}${kpi('Waiting for recount', n0(wait.length))}</div>
    ${ok.length ? `<div class="row"><button class="btn" id="vall">Verify all matching (${ok.length})</button></div>` : ''}
    <div class="hint">Verify confirms a matching count. Recount sends the product back to the employee. Accept difference sets the shelf balance to the counted quantity and records the shortage or excess.</div>
    ${pend.length ? `<div class="scroll"><table class="bc">${tblHead(['Counted on', 'Shelf', 'Product', 'Counted by', '>Counted', '>System', '>Difference', '>Value (BDT)', '>Round', ''])}<tbody>
    ${pend.map(r => { const d = diff(r); return `<tr><td>${esc(fmtDT(r.device_time))}</td><td class="w">${esc(r.warehouse_name)} / ${esc(shLbl(r.shelf_name))}</td><td class="w">${esc(r.product_code)} - ${esc(r.product_name)}</td><td>${esc(r.counted_by_name)}</td><td class="n">${n0(r.counted_pcs)}</td><td class="n">${n0(r.system_pcs)}</td>
      <td class="n" style="color:${d ? 'var(--err)' : 'var(--pri)'}"><b>${d ? sgn(d) : 'Match'}</b></td><td class="n">${d ? sgn(d * nz(r.mrp)) : ''}</td><td class="n">${r.rounds}</td>
      <td style="white-space:nowrap">${d === 0 ? `<button class="btn" data-v="${r.item_id}" style="padding:4px 10px;font-size:13px">Verify</button> ` : `<button class="btn light" data-ac="${r.item_id}" style="padding:4px 10px;font-size:13px">Accept difference</button> `}<button class="btn ghost" data-rc="${r.item_id}" style="color:var(--err);padding:4px 10px;font-size:13px">Recount</button></td></tr>`; }).join('')}</tbody></table></div>` : '<div class="empty">No counts are waiting for verification.</div>'}
    ${wait.length ? `<h3 class="cat">Waiting for recount</h3><div class="scroll"><table class="bc">${tblHead(['Shelf', 'Product', 'Counted by', 'Note to employee'])}<tbody>
    ${wait.map(r => `<tr><td class="w">${esc(r.warehouse_name)} / ${esc(shLbl(r.shelf_name))}</td><td class="w">${esc(r.product_code)} - ${esc(r.product_name)}</td><td>${esc(r.counted_by_name)}</td><td class="w">${esc(r.recount_note || '')}</td></tr>`).join('')}</tbody></table></div>` : ''}`;
  const verify = async ids => {
    const { data: res, error: e } = await db.rpc('count_verify', { p_items: ids });
    if (e) return toast(e.message || 'Could not verify.');
    toast(res.verified + ' verified' + (res.skipped ? ', ' + res.skipped + ' skipped because the system quantity changed.' : '.')); render();
  };
  const va = $('#vall'); if (va) va.onclick = () => { va.disabled = true; verify(ok.map(r => r.item_id)); };
  el.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { b.disabled = true; verify([b.dataset.v]); });
  el.querySelectorAll('[data-ac]').forEach(b => b.onclick = async () => {
    const r = pend.find(x => x.item_id === b.dataset.ac), d = diff(r);
    if (!confirm('Accept the difference for ' + r.product_name + '?\n\nSystem: ' + n0(r.system_pcs) + ' pcs, counted: ' + n0(r.counted_pcs) + ' pcs (' + sgn(d) + ' pcs, BDT ' + sgn(d * nz(r.mrp)) + ').\nThe shelf balance will be set to the counted quantity.')) return;
    b.disabled = true;
    const { error: e } = await db.rpc('count_accept', { p_item: r.item_id });
    if (e) { b.disabled = false; return toast(e.message || 'Could not accept the difference.'); }
    toast('Difference accepted and the shelf balance updated.'); render();
  });
  el.querySelectorAll('[data-rc]').forEach(b => b.onclick = async () => {
    const r = pend.find(x => x.item_id === b.dataset.rc);
    const okd = await formDlg('Send for recount', `<div class="hint" style="margin:0 0 10px"><b>${esc(r.product_code)} - ${esc(r.product_name)}</b><br>${esc(shLbl(r.shelf_name))} &middot; counted ${n0(r.counted_pcs)} pcs</div>
      <label>Note for the employee (optional)</label><textarea data-t rows="2" maxlength="200" placeholder="For example: please check the lower rack"></textarea>`, 'Send for recount', api => {
      api.run(async () => { const { error: e } = await db.rpc('count_recount', { p_item: r.item_id, p_note: api.q('[data-t]').value.trim() || null }); return e ? (e.message || 'Could not send for recount.') : ''; });
    });
    if (okd) { toast('Sent to the employee for recount.'); render(); }
  });
}

    sel.onchange = tog; tog(); nw.value = '';
    $('#pCode').value = p ? p.code : defCode; $('#pCode').disabled = !!p;
    $('#pName').value = p ? p.name : ''; $('#pMrp').value = p ? p.mrp : '';
    $('#pPer').value = p ? p.pcs_per_carton : 1; $('#pAct').checked = p ? p.is_active : true;
    $('#pMin').value = p ? (p.min_qty || 0) : 0; $('#pLead').value = p ? (p.lead_time_days ?? 7) : 7;
    d.onclose = () => {
      if (d.returnValue !== 'ok') return res(null);
      res({ code: $('#pCode').value.trim(), name: $('#pName').value.trim(), category: (sel.value === '__new' ? nw.value : sel.value).trim() || null,
            mrp: Number($('#pMrp').value), min_qty: Math.max(0, parseInt($('#pMin').value, 10) || 0), lead_time_days: Math.max(0, parseInt($('#pLead').value, 10) || 0), pcs_per_carton: parseInt($('#pPer').value, 10), is_active: $('#pAct').checked });
    };
    d.showModal();
  });
}

async function saveProduct(p, cats, defCode){
  const v = await productForm(p, cats, defCode); if (!v) return;
  const { code, ...rest } = v;
  const { error } = p ? await db.from('products').update(rest).eq('id', p.id) : await db.from('products').insert(v);
  if (error) toast(error.code === '23505' ? 'A product with this code already exists.' : 'Could not save the product.');
  else { toast('Product saved.'); render(); }
}

async function renderProducts(el){
  const { data, error } = await db.from('products').select('*');
  if (error) throw error;
  const all = (data || []).sort((a, b) => (parseInt(a.code) || 0) - (parseInt(b.code) || 0) || a.code.localeCompare(b.code));
  const cats = [...new Set(all.map(p => p.category).filter(Boolean))].sort();
  const nextCode = String(Math.max(0, ...all.map(p => parseInt(p.code) || 0)) + 1);
  el.innerHTML = `<div class="crumb"><h2>Products</h2>${isAdmin() ? '<button class="btn" id="addPr">Add product</button>' : ''}</div>
    <div class="row"><input id="pq" type="search" placeholder="Search by name or code" aria-label="Search products">
    <select id="pc" aria-label="Filter by category"><option value="">All categories</option>${cats.map(c => `<option>${esc(c)}</option>`).join('')}</select></div>
    <div id="plist"></div>`;
  const draw = () => {
    const q = $('#pq').value.trim().toLowerCase(), c = $('#pc').value;
    const rows = all.filter(p => (isAdmin() || p.is_active) && (!c || p.category === c) && (!q || p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q)));
    const g = {}; rows.forEach(p => (g[p.category || 'Uncategorized'] ??= []).push(p));
    $('#plist').innerHTML = rows.length ? Object.keys(g).sort().map(k => `<h3 class="cat">${esc(k)} (${g[k].length})</h3><div class="list">${g[k].map(p =>
      `<${isAdmin() ? 'button' : 'div'} class="item ${p.is_active ? '' : 'off'} ${isAdmin() ? '' : 'ro'}" data-id="${p.id}">
        <span class="ico">${I('box')}</span><span class="grow"><b>${esc(p.name)}</b><span class="sub">Code ${esc(p.code)}${isAdmin() && p.min_qty > 0 ? ' &middot; Min ' + p.min_qty + ' pcs' : ''}</span></span>
        ${p.is_active ? '' : '<span class="tag">Inactive</span>'}<b>&#2547; ${Number(p.mrp).toLocaleString('en-US')}</b></${isAdmin() ? 'button' : 'div'}>`).join('')}</div>`).join('')
      : '<div class="empty">No products match your search.</div>';
  };
  $('#pq').oninput = draw; $('#pc').onchange = draw; draw();
  $('#plist').onclick = e => { const b = e.target.closest('[data-id]'); if (b && isAdmin()) saveProduct(all.find(p => p.id === b.dataset.id), cats, nextCode); };
  const add = $('#addPr'); if (add) add.onclick = () => saveProduct(null, cats, nextCode);
}

/* ---------- App shell: navigation, account sheet, native hooks ---------- */
const ROOTS = ['wh', 'prod', 'loc', 'verify', 'reports', 'users'];
let navStack = [];
const vKey = v => [v.t, v.wh && v.wh.id, v.shelf && v.shelf.id, v.loc && v.loc.id, v.rep].join('|');
function navUpdate(v, isBack){
  if (ROOTS.includes(v.t)) { navStack = []; return; }
  if (isBack) return;
  const i = navStack.findIndex(x => vKey(x) === vKey(v));
  if (i >= 0) { navStack.length = i; return; }
  if (view && vKey(view) !== vKey(v)) { navStack.push(view); history.pushState(null, ''); }
}
function viewTitle(v){
  switch (v.t) {
    case 'wh': return 'Warehouses'; case 'prod': return 'Products'; case 'loc': return 'Locations';
    case 'verify': return 'Count verification'; case 'reports': return 'Reports'; case 'users': return 'Users';
    case 'shelves': return v.wh ? v.wh.name : 'Shelves';
    case 'shelf': return v.shelf ? shLbl(v.shelf.name) : 'Shelf';
    case 'count': return 'Physical count'; case 'whstock': return v.wh ? 'Stock - ' + v.wh.name : 'Warehouse stock'; case 'wcount': return v.wh ? 'Count - ' + v.wh.name : 'Warehouse count'; case 'bincard': return 'Bin card';
    case 'locdetail': return v.loc ? v.loc.name : 'Location';
    case 'rep': { const r = REPORTS.find(x => x.k === v.rep); return r ? r.t : 'Report'; }
    default: return 'Bin Card Pro';
  }
}
function updateBar(){
  document.body.classList.toggle('wm-on', view.t === 'bincard');
  $('#navBack').classList.toggle('hidden', ROOTS.includes(view.t));
  $('#barTitle').textContent = viewTitle(view);
}
function handleBack(fromPop){
  const d = document.querySelector('dialog[open]');
  if (d) { d.close(); if (fromPop && navStack.length) history.pushState(null, ''); return; }
  if (navStack.length) { go(navStack.pop(), true); return; }
  if (fromPop) return;
  if (view.t !== 'wh') { go({ t: 'wh' }); return; }
  const A = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (A && A.exitApp) A.exitApp();
}
window.addEventListener('popstate', () => handleBack(true));
$('#navBack').onclick = () => { if (navStack.length) history.back(); else handleBack(false); };

const TAB_ICONS = {
  wh: '<path d="M3 21V9l9-5 9 5v12"/><path d="M8 21v-7h8v7"/>',
  prod: '<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  loc: '<path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  verify: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',
  reports: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'
};
document.querySelectorAll('.tabs button').forEach(b => {
  const ic = TAB_ICONS[b.dataset.tab]; if (!ic) return;
  b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ic + '</svg><span class="lb">' + esc(b.textContent) + '</span>';
});

function fillAccount(){
  const nm = me.full_name || me.email || '';
  $('#whoName').textContent = nm; $('#whoSub').textContent = me.email || '';
  $('#roleTag').textContent = me.role;
  const ini = nm.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';
  $('#acctIni').textContent = ini; $('#acctAv').textContent = ini;
  $('#acUsers').style.display = isAdmin() ? '' : 'none';
  $('#verLine').textContent = 'Version ' + APP_VERSION + (IS_NATIVE ? ' (Android app)' : ' (web)');
}
$('#acctBtn').onclick = () => $('#acct').showModal();
$('#acClose').onclick = () => $('#acct').close();
$('#acUsers').onclick = () => { $('#acct').close(); go({ t: 'users' }); };
$('#logout').addEventListener('click', () => $('#acct').close());

function cmpVer(a, b){
  const x = String(a).replace(/^v/i, '').split('.').map(n => parseInt(n, 10) || 0), y = String(b).replace(/^v/i, '').split('.').map(n => parseInt(n, 10) || 0);
  for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0) ? 1 : -1; }
  return 0;
}
async function checkUpdate(){
  if (!IS_NATIVE) return;
  try {
    const r = await fetch('https://api.github.com/repos/imsopneelakash/uoll-bin-card-pro/releases/latest', { headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) return;
    const j = await r.json();
    if (j.tag_name && cmpVer(j.tag_name, APP_VERSION) > 0) {
      $('#updBox').innerHTML = '<a href="' + APK_URL + '" target="_blank" rel="noopener">A new version (' + esc(j.tag_name) + ') is available. Tap to download and install.</a>';
      if (!$('#acctBtn .dot')) $('#acctBtn').insertAdjacentHTML('beforeend', '<span class="dot"></span>');
    }
  } catch (e) { /* offline or rate limited */ }
}
const setOnline = () => $('#offline').classList.toggle('hidden', navigator.onLine !== false);
window.addEventListener('online', setOnline); window.addEventListener('offline', setOnline); setOnline();

if (IS_NATIVE) {
  document.documentElement.classList.add('native');
  const PL = window.Capacitor.Plugins || {};
  try { if (PL.StatusBar) { PL.StatusBar.setBackgroundColor({ color: '#14582a' }); PL.StatusBar.setStyle({ style: 'DARK' }); } } catch (e) {}
  try { if (PL.App) PL.App.addListener('backButton', () => handleBack(false)); } catch (e) {}
  try { if (PL.SplashScreen) setTimeout(() => PL.SplashScreen.hide(), 400); } catch (e) {}
}

boot();

/* ---------- UI v2: login helpers ---------- */
try {
  const em = $('#em'); const saved = localStorage.getItem('uoll_email'); if (em && saved && !em.value) em.value = saved;
  if (em) em.addEventListener('change', () => { try { localStorage.setItem('uoll_email', em.value.trim()); } catch (e) {} });
  const eye = $('#pwEye'), pw = $('#pw');
  if (eye && pw) eye.onclick = () => { const show = pw.type === 'password'; pw.type = show ? 'text' : 'password'; eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); eye.style.color = show ? 'var(--pri)' : ''; };
} catch (e) {}
